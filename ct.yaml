chart-dirs:
  - charts
validate-maintainers: false
remote: origin
target-branch: main
chart-repos:
  - fluent=https://fluent.github.io/helm-charts
excluded-charts:
  - agentgateway-bootstrap
  - centcom-satellite
  - clickhouse-operator-bootstrap
  - cloudnative-pg-bootstrap
  - cloudnative-pg-operator
  # Renders argoproj.io/v1alpha1 Application/AppProject; `ct install` runs on a
  # bare kind cluster with no Argo CD CRDs, so the install can never succeed.
  # Only reachable when the chart's own content changes (a dependency bump).
  - common-bootstrap
  - crossplane-providers
  - grafana
  # Both charts below render dip.io/v1alpha1 Postgres claims and/or
  # argoproj.io/v1alpha1 Applications, which a bare kind cluster has no CRDs
  # for, so `ct install` fails with "resource mapping not found" on any PR that
  # touches them. Same treatment as the other bootstrap charts above.
  - dex-issuer
  - k8s-observability-monitoring
  - langfuse-bootstrap
  - loki-bootstrap
  - mimir-bootstrap
  - otlp-gateway-bootstrap
  - tempo-bootstrap
