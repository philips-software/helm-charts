name: Helm Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Not strictly required (push_with_retry absorbs ghcr replication lag, and
# re-pushing an existing tag just overwrites it), but serializing is cheap and
# avoids two runs racing to login/push/sign at once. cancel-in-progress is
# left off so a queued run never interrupts another run's cosign step.
concurrency:
  group: helm-publish-ghcr
  cancel-in-progress: false

jobs:
  helm:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      id-token: write # for cosign keyless signing of the pushed charts
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and Push the Helm Charts to GitHub Container Registry
        uses: ./.github/actions/action-helm-chart-repo
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          chartsPath: ./charts/
