name: Release Charts

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/release.yml'

# chart-releaser mutates two repo-wide singletons: the GitHub Releases/tags
# namespace and the gh-pages branch/index.yaml. The group is a fixed string,
# not keyed on github.ref, because it guards those shared resources rather
# than anything specific to the ref that triggered the run. Cancelling a
# queued run is disabled: a run killed between creating the release and
# pushing the index would leave that same partial state behind. A replaced
# *pending* run loses nothing, because chart-releaser discovers its charts
# from "changed since the latest tag" at the time it runs, so anything the
# cancelled run would have released is picked up by the run that replaces it.
concurrency:
  group: release-charts-gh-pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.10.0

      - name: Add dependency chart repos
        run: |
          helm repo add fluent https://fluent.github.io/helm-charts

      - name: Install helm-docs
        env:
          # renovate: datasource=github-releases depName=norwoodj/helm-docs
          HELM_DOCS_VERSION: 1.14.2
        run: |
          curl -fsSL "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin helm-docs
          helm-docs --version

      # version-guard (lint-test.yml) blocks a PR whose changed chart didn't
      # move version:, but Renovate (and humans) can still merge with a stale
      # install.sh marker or stale docs if the bump landed through some other
      # path. Re-check on the push, where this workflow is known to run, so a
      # missed bump/marker/docs update is caught before chart-releaser runs.
      - name: Bump chart versions missed before merge
        id: bump
        run: |
          bumped="$(.github/prepare-release.sh "${{ github.event.before }}")"
          echo "charts=${bumped//$'\n'/, }" >> "$GITHUB_OUTPUT"

      - name: Commit the version bump to main
        id: push
        if: steps.bump.outputs.charts != ''
        continue-on-error: true
        run: |
          # Renovate merges in bursts, so another push to main can leave this
          # checkout behind origin/main mid-run: rebase once before giving up.
          git push origin "HEAD:main" || {
            git pull --rebase --autostash origin main
            git push origin "HEAD:main"
          }

      - name: Report chart changes left unpushed
        if: steps.push.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHARTS: ${{ steps.bump.outputs.charts }}
        run: |
          # The commit (version bump, install.sh marker reconcile, and/or
          # regenerated docs) is local but main is protected against CI
          # pushes, so nothing shipped. File it loudly instead of letting it
          # rot the way the PR-time failures did: a version or marker
          # mismatch left in place makes chart-releaser skip the chart.
          echo "::error::Could not push release-pipeline changes to main. These charts changed but the commit was not pushed, so chart-releaser may skip or publish stale docs for them: ${CHARTS}"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "chart release-pipeline commit blocked on main (${GITHUB_SHA:0:8})" \
            --body "$(printf 'The release run for `%s` committed version/marker/docs updates for:\n\n%s\n\nbut could not push to main, so chart-releaser (skip_existing) may skip them or publish with stale docs.\n\nRun `.github/prepare-release.sh` against `origin/main` locally and push the commit, or allow the Actions app to push to main.' "$GITHUB_SHA" "${CHARTS}")" || true

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.9.0
        with:
          skip_existing: true
        env:
          CR_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
