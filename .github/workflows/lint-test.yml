name: Lint and Test Charts

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - charts/**
      - .github/workflows/lint-test.yml

jobs:
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check chart versions were bumped
        run: |
          base="origin/${{ github.event.repository.default_branch }}"
          git fetch --quiet origin "${{ github.event.repository.default_branch }}"
          .github/check-chart-versions.sh "$base"

  # Catches upstream chart bumps that would change an immutable StatefulSet
  # field. ct lint/install cannot see these: they install the new chart into an
  # empty cluster, so there is no old object to conflict with. Argo CD cannot
  # recover from them on its own, so they must be caught before merge.
  statefulset-immutable-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Check for immutable StatefulSet changes
        run: |
          base="origin/${{ github.event.repository.default_branch }}"
          git fetch --quiet origin "${{ github.event.repository.default_branch }}"
          .github/check-statefulset-immutables.sh "$base"

  lint-test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.10.0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "::set-output name=changed::true"
          fi

      - name: Run chart-testing (lint)
        run: |
          ct lint \
            --config ct.yaml \
            --target-branch ${{ github.event.repository.default_branch }}

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.1
        if: steps.list-changed.outputs.changed == 'true'

      - name: Run chart-testing (install)
        run: |
          ct install --debug \
            --config ct.yaml \
            --target-branch ${{ github.event.repository.default_branch }}
