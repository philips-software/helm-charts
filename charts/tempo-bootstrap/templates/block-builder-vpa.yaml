{{- if and .Values.vpa.enabled .Values.vpa.components.blockBuilder.enabled }}
apiVersion: "autoscaling.k8s.io/v1"
kind: VerticalPodAutoscaler
metadata:
  name: tempo-block-builder-vpa
  namespace: tempo-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: StatefulSet
    name: tempo-block-builder
  updatePolicy:
    minReplicas: 1
    updateMode: {{ .Values.vpa.updateMode | default "Auto" }}
  resourcePolicy:
    containerPolicies:
      - containerName: '*'
        minAllowed:
          {{- toYaml .Values.vpa.components.blockBuilder.minAllowed | nindent 10 }}
        maxAllowed:
          {{- toYaml .Values.vpa.components.blockBuilder.maxAllowed | nindent 10 }}
        controlledResources: ["memory", "cpu"]
{{- end }}
