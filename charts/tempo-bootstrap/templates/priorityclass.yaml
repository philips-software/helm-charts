{{- if .Values.priorityClass.enabled }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.priorityClass.name }}
  labels:
    {{- include "tempo-bootstrap.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
value: {{ .Values.priorityClass.value | int }}
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "tempo stateful write path (tempo-bootstrap); above default-priority workloads, below system-* classes"
{{- end }}
