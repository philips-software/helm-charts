{{- if and .Values.vpa.enabled .Values.vpa.components.queryFrontend.enabled }}
apiVersion: "autoscaling.k8s.io/v1"
kind: VerticalPodAutoscaler
metadata:
  name: tempo-query-frontend-vpa
  namespace: tempo-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: tempo-query-frontend
  updatePolicy:
    minReplicas: 1
    updateMode: {{ .Values.vpa.updateMode | default "Auto" }}
  resourcePolicy:
    containerPolicies:
      - containerName: '*'
        minAllowed:
          {{- toYaml .Values.vpa.components.queryFrontend.minAllowed | nindent 10 }}
        maxAllowed:
          {{- toYaml .Values.vpa.components.queryFrontend.maxAllowed | nindent 10 }}
        controlledResources: ["memory", "cpu"]
{{- end }}
