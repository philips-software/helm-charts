{{- if .Values.kafkaNodePool.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: tempo-kafka
  namespace: tempo-system
  labels:
    app.kubernetes.io/name: tempo-kafka
    app.kubernetes.io/component: kafka
spec:
  type: ClusterIP
  ports:
    - port: 9092
      protocol: TCP
      name: kafka
      targetPort: kafka
  selector:
    app.kubernetes.io/name: tempo-kafka
    app.kubernetes.io/component: kafka
---
apiVersion: v1
kind: Service
metadata:
  name: tempo-kafka-headless
  namespace: tempo-system
  labels:
    app.kubernetes.io/name: tempo-kafka
    app.kubernetes.io/component: kafka
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - port: 9092
      protocol: TCP
      name: kafka
      targetPort: kafka
    - port: 9093
      protocol: TCP
      name: controller
      targetPort: controller
  selector:
    app.kubernetes.io/name: tempo-kafka
    app.kubernetes.io/component: kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tempo-kafka
  namespace: tempo-system
  labels:
    app.kubernetes.io/name: tempo-kafka
    app.kubernetes.io/component: kafka
spec:
  podManagementPolicy: Parallel
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo-kafka
      app.kubernetes.io/component: kafka
  serviceName: tempo-kafka-headless
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tempo-kafka
        app.kubernetes.io/component: kafka
    spec:
      securityContext:
        fsGroup: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      nodeSelector:
        {{- range $key, $value := .Values.kafkaNodePool.labels }}
        {{ $key }}: {{ $value }}
        {{- end }}
      tolerations:
      - key: workload
        operator: Equal
        value: tempo-kafka
        effect: NoSchedule
      containers:
        - name: kafka
          image: docker.io/apache/kafka-native:4.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9092
              name: kafka
              protocol: TCP
            - containerPort: 9093
              name: controller
              protocol: TCP
          env:
            - name: _POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_CLUSTER_ID
              value: "TempoKafkaCluster001"
            - name: KAFKA_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://$(_POD_NAME).tempo-kafka-headless.tempo-system.svc.cluster.local:9092
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 0@tempo-kafka-0.tempo-kafka-headless.tempo-system.svc.cluster.local:9093
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - mountPath: /var/lib/kafka/data
              name: data
              subPath: data
            - mountPath: /opt/kafka/config
              name: kafka-config
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: kafka-config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.kafka.persistence.size }}
{{- end }}
