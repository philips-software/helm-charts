tempoChart:
  # renovate: datasource=helm depName=tempo-distributed registryUrl=https://grafana-community.github.io/helm-charts
  version: 3.11.0

compactorOrgmapper:
  package: ghcr.io/loafoe/compactor-orgmapper
  # renovate: datasource=docker depName=ghcr.io/loafoe/compactor-orgmapper
  tag: v0.0.1

initOverrides:
  package: busybox
  # renovate: datasource=docker depName=busybox
  tag: 1.38.0

environmentConfig:
  resourcePrefix: ""
  region: ""
  accountId: ""

# The name of an existing S3 bucket to use for Tempo storage.
# This value is required and cannot be empty.
# You can use variables like ${resourcePrefix} and ${region} which will be replaced
# with values from environmentConfig.
# Example: "my-bucket-${resourcePrefix}-tempo" will become "my-bucket-prod-tempo"
existingBucketName: ""

argoProject: default

streamOverHTTPEnabled: true

multitenancyEnabled: true

# Gateway configuration
gateway:
  # -- Number of gateway replicas
  replicas: 2

# Block-builder configuration
blockBuilder:
  # -- Number of block-builder replicas
  replicas: 3

# Live-store configuration
liveStore:
  # -- Number of live-store replicas
  replicas: 3

# Distributor configuration
distributor:
  # -- Number of distributor replicas
  replicas: 2

# Querier configuration
querier:
  # -- Number of querier replicas
  replicas: 2

# Query-frontend configuration
queryFrontend:
  # -- Number of query-frontend replicas
  replicas: 2

# Compactor configuration
compactor:
  # -- Number of compactor replicas
  replicas: 1

kafka:
  persistence:
    size: 100Gi

kafkaNodePool:
  enabled: true
  labels:
    workload: tempo-kafka
  # The taint key applied to the dedicated Kafka nodes (and tolerated by the
  # Kafka StatefulSet). Defaults to the platform-wide "dedicated node" key so
  # cluster infra pods with an Exists toleration for it (e.g. trivy-operator's
  # node-collector) can still be scheduled here.
  taintKey: cilium.hsp.philips.com/dedicated
  nodeClassRefName: bottlerocket-v2
  resources:
    limits:
      cpu: 4
      memory: 16Gi
  expireAfter: 3600h  # half a year

