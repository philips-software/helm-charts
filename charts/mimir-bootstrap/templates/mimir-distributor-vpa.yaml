{{- if and .Values.vpa.enabled .Values.vpa.components.distributor.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  namespace: mimir-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: mimir-distributor-vpa
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: "mimir-distributor"
  updatePolicy:
    minReplicas: 3
    updateMode: {{ .Values.vpa.updateMode | default "Auto" }}
  resourcePolicy:
    containerPolicies:
      - containerName: '*'
        minAllowed:
          {{- toYaml .Values.vpa.components.distributor.minAllowed | nindent 10 }}
        maxAllowed:
          {{- toYaml .Values.vpa.components.distributor.maxAllowed | nindent 10 }}
        controlledResources: ["memory", "cpu"]
{{- end }}