{{- if and .Values.vpa.enabled .Values.vpa.components.querier.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  namespace: mimir-system
  name: mimir-querier-vpa
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: "mimir-querier"
  updatePolicy:
    minReplicas: 1
    updateMode: {{ .Values.vpa.updateMode | default "Auto" }}
  resourcePolicy:
    containerPolicies:
      - containerName: '*'
        minAllowed:
          {{- toYaml .Values.vpa.components.querier.minAllowed | nindent 10 }}
        maxAllowed:
          {{- toYaml .Values.vpa.components.querier.maxAllowed | nindent 10 }}
        controlledResources: ["memory", "cpu"]
{{- end }}