{{- if and .Values.vpa.enabled .Values.vpa.components.ingester.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  namespace: mimir-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: mimir-ingester-zone-a-vpa
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: StatefulSet
    name: "mimir-ingester-zone-a"
  updatePolicy:
    minReplicas: 1
    updateMode: {{ .Values.vpa.updateMode | default "Auto" }}
  resourcePolicy:
    containerPolicies:
      - containerName: '*'
        minAllowed:
          {{- toYaml .Values.vpa.components.ingester.minAllowed | nindent 10 }}
        maxAllowed:
          {{- toYaml .Values.vpa.components.ingester.maxAllowed | nindent 10 }}
        controlledResources: ["memory", "cpu"]
{{- end }}