mimirChart:
  # renovate: datasource=helm depName=mimir-distributed registryUrl=https://grafana.github.io/helm-charts
  version: 6.2.2

compactorOrgmapper:
  package: ghcr.io/loafoe/compactor-orgmapper
  # renovate: datasource=docker depName=ghcr.io/loafoe/compactor-orgmapper
  tag: v0.0.1

initOverrides:
  package: busybox
  # renovate: datasource=docker depName=busybox
  tag: 1.38.0

environmentConfig:
  resourcePrefix: ""
  region: ""
  # Ownership metadata propagated onto managed workloads so they satisfy the
  # require-owner-label Kyverno policy. Empty owner omits the label;
  # empty managedBy keeps the chart's default app.kubernetes.io/managed-by value.
  owner: ""
  managedBy: ""

mimirProvider:
  enabled: false
  package: ghcr.io/loafoe/provider-mimir
  # renovate: datasource=docker depName=ghcr.io/loafoe/provider-mimir
  tag: v1.3.1
  # URI configuration (defaults to internal mimir-gateway service)
  uri: "http://mimir-gateway.mimir-system.svc.cluster.local/prometheus"
  rulerUri: "http://mimir-gateway.mimir-system.svc.cluster.local/prometheus"
  alertmanagerUri: "http://mimir-gateway.mimir-system.svc.cluster.local"
  orgId: "anonymous"
  credentials:
    # authType: basic or token
    authType: basic
    # For basic auth
    secretName: mimir-provider-credentials
    usernameKey: username
    passwordKey: password
    # For token auth (used when authType: token)
    tokenKey: token

argoProject: default

kafka:
  persistence:
    size: 100Gi

kafkaNodePool:
  enabled: true
  # Name of the Karpenter NodePool.
  #
  # This defaults to the cluster-generic "kafka-nodepool" purely for backwards
  # compatibility. The accurate name is "mimir-kafka-nodepool" -- this pool is
  # owned by mimir-bootstrap, and tempo-bootstrap's equivalent is already called
  # "tempo-kafka-nodepool". New clusters should set the accurate name from the
  # start.
  #
  # The default is deliberately NOT the accurate name, because changing it is a
  # node-replacing operation, not a rename. Argo CD prunes the old NodePool,
  # Karpenter deletes the NodeClaims it owns, and those nodes drain. On
  # ri-obs-use1-dev that pool is a single t4g.large running the SOLE Kafka
  # broker (mimir-kafka replicas: 1) whose 500Gi gp3 PVC is pinned to one
  # availability zone, so the replacement node must come up in that same zone
  # before the broker can start. Flipping the default would turn every routine
  # chart bump into an unplanned live-metrics ingestion gap.
  #
  # To migrate, in a maintenance window:
  #   1. Confirm the blast radius:
  #        kubectl get nodes -l karpenter.sh/nodepool=kafka-nodepool
  #        kubectl get nodeclaims -l karpenter.sh/nodepool=kafka-nodepool
  #   2. Note the zone of the Kafka PVC's PV; the new node must land there:
  #        kubectl get pv $(kubectl get pvc -n mimir-system \
  #          kafka-data-mimir-kafka-0 -o jsonpath='{.spec.volumeName}') \
  #          -o jsonpath='{.spec.nodeAffinity}'
  #   3. Set name: mimir-kafka-nodepool and sync.
  #   4. Watch the broker return; the PVC is retained and reattached, so no
  #      data is lost, but expect a short ingestion gap while the node is
  #      provisioned and Kafka restarts.
  #
  # The pod's scheduling identity is the labels and taint below, not this name,
  # so those must stay unchanged across the migration or the broker will not
  # schedule onto the new pool at all.
  #
  # -- Karpenter NodePool name. Prefer "mimir-kafka-nodepool"; the default is
  # the legacy cluster-generic name. Changing this REPLACES the nodes (Argo CD
  # prunes the old NodePool, Karpenter drains it), briefly taking the sole Kafka
  # broker offline -- treat it as a maintenance window and read the notes in
  # values.yaml first.
  name: kafka-nodepool
  labels:
    workload: kafka
  # The taint key applied to the dedicated Kafka nodes (and tolerated by the
  # Kafka StatefulSet). Defaults to the platform-wide "dedicated node" key so
  # cluster infra pods with an Exists toleration for it (e.g. trivy-operator's
  # node-collector) can still be scheduled here.
  taintKey: cilium.hsp.philips.com/dedicated
  nodeClassRefName: bottlerocket-v2
  # Consolidation policy for the dedicated Kafka node pool. This pool hosts
  # the sole broker for live metrics ingestion, so nodes must never be torn
  # down while still in use. "WhenEmptyOrUnderutilized" allows Karpenter to
  # drain/replace nodes that look underutilized, which can disrupt the
  # broker. Keep this as "WhenEmpty" (or set to "WhenEmptyOrUnderutilized"
  # only if you fully understand the risk).
  consolidationPolicy: WhenEmpty
  # Minimum instance memory (MiB) Karpenter will pick for this nodepool.
  # Was hardcoded to 4000, which qualifies instances like t4g.medium
  # (4096Mi total) -- after mandatory per-node DaemonSets (CNI, kube-proxy,
  # SPIRE agent, log shippers, etc.) claim their share, as little as ~1Gi
  # was left allocatable, right at the edge of what the Kafka pod itself
  # requests (1Gi), causing persistent "Insufficient memory" scheduling
  # failures. Raised the default floor so Karpenter picks a larger instance
  # with real headroom.
  minInstanceMemoryMiB: 8000
  resources:
    limits:
      cpu: 4
      memory: 16Gi
  expireAfter: 3600h  # half a year

# The name of an existing S3 bucket to use for Mimir storage.
# This value is required and cannot be empty.
# You can use variables like ${resourcePrefix} and ${region} which will be replaced
# with values from environmentConfig.
# Example: "my-bucket-${resourcePrefix}-mimir" will become "my-bucket-prod-mimir"
existingBucketName: ""

# Enable multitenancy in Mimir
multitenancyEnabled: true

ruler:
  # Maximum number of rules per rule group
  maxRulesPerRuleGroup: 1200
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 2Gi

# Mimir limits configuration
limits:
  # Accept out-of-order samples up to this duration in the past
  outOfOrderTimeWindow: 30m
  # Maximum number of label names per series
  maxLabelNamesPerSeries: 35
  # Maximum number of exemplars stored per user (0 = disabled)
  maxGlobalExemplarsPerUser: 0

# Mimir runtime_config limits, rendered into config/mimir-values.yaml.tmpl.
#
# These blocks must exist even if empty: the template dereferences
# .Values.runtimeConfig.ingester_limits.max_ingestion_rate directly, and the
# `| default` pipes downstream of that cannot rescue a nil parent map. Without
# them `helm template` fails outright with "nil pointer evaluating
# interface {}.ingester_limits", which also made
# .github/check-statefulset-immutables.sh silently skip this chart.
#
# The values below match the template's own `| default` fallbacks.
runtimeConfig:
  # Limits each ingester replica enforces
  ingester_limits:
    max_ingestion_rate: 80000
  # Limits each distributor replica enforces
  distributor_limits:
    max_ingestion_rate: 80000
    max_inflight_push_requests: 60000
    max_inflight_push_requests_bytes: 50000000

# Gateway configuration
gateway:
  # -- Number of gateway replicas
  replicas: 3

# Distributor configuration
distributor:
  # -- Number of distributor replicas
  replicas: 6

# Query frontend configuration
# Mimir Query Engine (MQE) settings shared by query_frontend and querier --
# both components register and validate these flags, so they must match.
queryEngine:
  # -- [experimental] MQE remote execution requires every querier to report
  # a compatible "query plan version" via the ring; this negotiation is
  # flaky under churn (observed as intermittent 500s: "could not determine
  # maximum supported query plan version ... at least one querier in the
  # ring is not reporting a supported query plan version", even while the
  # flagged querier was actively evaluating other queries successfully at
  # the same time). Keep disabled until upstream stabilizes this.
  #
  # Also gates use-mimir-query-engine-for-sharding, which defaults to true
  # and requires remote execution to be enabled -- mismatched settings fail
  # startup config validation, so both flags are driven by this one value.
  enableRemoteExecution: false

queryFrontend:
  # -- Number of query-frontend replicas
  replicas: 3
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 3Gi

# Ingester configuration
ingester:
  # -- Number of ingester replicas
  replicas: 9
  # -- Replication factor for ingested data.
  # RF=3 (default): Data replicated to 3 zones, can survive 2 zone failures.
  # RF=2: Data replicated to 2 zones, saves ~33% ingester memory but less durable.
  replicationFactor: 3
  persistentVolume:
    # -- Size of the persistent volume for each ingester replica
    size: 100Gi
  resources:
    requests:
      cpu: 200m
      memory: 4Gi
    limits:
      memory: 8Gi

# Querier configuration
querier:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1.5Gi

# Admin-cache (memcached) configuration
adminCache:
  # -- Number of admin-cache replicas
  replicas: 2

# Chunks-cache (memcached) configuration
chunksCache:
  # -- Number of chunks-cache replicas
  replicas: 2

# Index-cache (memcached) configuration
indexCache:
  # -- Number of index-cache replicas
  replicas: 2

# Results-cache (memcached) configuration
resultsCache:
  # -- Number of results-cache replicas
  replicas: 4

store_gateway:
  persistentVolume:
    # -- Size of the persistent volume for each store-gateway replica
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 3Gi

compactor:
  persistentVolume:
    # -- Size of the persistent volume for compactor
    size: 80Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

karpenter:
  # If true, stateful components (ingester, store-gateway, etc.) will be annotated
  # with karpenter.sh/do-not-disrupt: "true" to prevent consolidation.
  doNotDisrupt: false

# Vertical Pod Autoscalers for Mimir components. Requires the VPA CRDs.
# Previously hardcoded directly in the templates with no values.yaml
# plumbing or enable toggle; now configurable per-component like the other
# *-bootstrap charts.
vpa:
  # -- Enable VPA resources for Mimir components
  enabled: true
  # -- VPA update mode (e.g. Off, Initial, Auto, InPlaceOrRecreate)
  updateMode: Auto
  components:
    distributor:
      enabled: true
      minAllowed:
        cpu: 350m
        memory: 512Mi
      maxAllowed:
        cpu: 1
        memory: 8Gi
    ingester:
      enabled: true
      minAllowed:
        cpu: 350m
        memory: 2Gi
      maxAllowed:
        cpu: 1
        memory: 16Gi
    querier:
      enabled: true
      minAllowed:
        cpu: 100m
        memory: 128Mi
      maxAllowed:
        cpu: 500m
        memory: 2Gi
    queryFrontend:
      enabled: true
      minAllowed:
        cpu: 100m
        memory: 128Mi
      maxAllowed:
        cpu: 500m
        # Was 2Gi, which sat below queryFrontend.resources.limits.memory (3Gi)
        # above -- the VPA could never reach the already-configured static
        # limit. Set with headroom above it instead.
        memory: 4Gi

# -- PriorityClass for the stateful write path (ingesters and the ingest-storage kafka): these hold
# not-yet-flushed data, so if they are evicted or left Pending on a full node, ingestion stalls and
# un-replicated data is at risk. Without it they run at the default priority 0, the same as every
# stateless query/read pod, and can be preempted by (or fail to preempt) any of them. The value sits
# well below the built-in system-node-critical/system-cluster-critical classes, so node agents and
# cluster add-ons still win. Created by this chart with a chart-specific name, so it does not clash
# with the loki/mimir/tempo-bootstrap siblings. Note: a PriorityClass value is immutable; to change
# it, also change the name.
priorityClass:
  enabled: true
  name: mimir-stateful
  value: 1000000
