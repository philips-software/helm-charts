{{- if .Values.zitadelProvider.enabled }}
apiVersion: zitadel.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: zitadel
  labels:
    {{- include "zitadel-bootstrap.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  url: {{ include "zitadel-bootstrap.providerUrl" . | quote }}
  insecure: {{ .Values.zitadelProvider.insecure }}
  insecureSkipTLSVerify: {{ .Values.zitadelProvider.insecureSkipTLSVerify }}
  {{- with .Values.zitadelProvider.organizationID }}
  organizationID: {{ . | quote }}
  {{- end }}
  credentials:
    source: Secret
    authType: {{ .Values.zitadelProvider.credentials.authType }}
    {{- if eq .Values.zitadelProvider.credentials.authType "ServiceAccount" }}
    serviceAccount:
      keySecretRef:
        name: {{ .Values.zitadelProvider.credentials.secretName }}
        key: {{ .Values.zitadelProvider.credentials.keyFileKey }}
    {{- else if eq .Values.zitadelProvider.credentials.authType "Token" }}
    token:
      tokenSecretRef:
        name: {{ .Values.zitadelProvider.credentials.secretName }}
        key: {{ .Values.zitadelProvider.credentials.tokenKey }}
    {{- end }}
{{- end }}
