apiVersion: v1
kind: Secret
metadata:
  name: zitadel-credentials
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "zitadel-bootstrap.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  masterkey: {{ .Values.credentials.masterkey | quote }}
  adminPassword: {{ .Values.credentials.adminPassword | quote }}
