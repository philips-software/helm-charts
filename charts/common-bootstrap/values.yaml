# DIP Addons Bootstrap Chart
# This chart bootstraps the DIP platform by:
# 1. Creating an EnvironmentConfig from the dip-addons ConfigMap
# 2. Deploying crossplane-compositions (HelmApplication XRD)
# 3. Using HelmApplication CRs to deploy platform components

# Source ConfigMap containing environment values
sourceConfigMap:
  name: hsp-addons
  namespace: hsp-addons

# EnvironmentConfig to create from the ConfigMap
environmentConfig:
  # Name of the EnvironmentConfig to create
  name: hsp-addons-compat
  # Labels for the EnvironmentConfig
  labels:
    config: dip-software

# Crossplane Compositions deployment
crossplaneCompositions:
  enabled: true
  repoURL: https://github.com/loafoe/crossplane-compositions
  # targetRevision defaults to Chart.AppVersion (v{{ .Chart.AppVersion }})
  # Uncomment to override:
  # targetRevision: v0.0.24
  path: kustomize

# ArgoCD configuration
#
# Two projects, split by blast radius:
#   - projects.infra: cluster-wide operators/CRDs (cloudnative-pg-operator,
#     crossplane-compositions). Needs clusterResourceWhitelist for CRDs,
#     ClusterRoles, etc.
#   - projects.apps: namespaced workloads bootstrapped alongside infra
#     (k8s-monitoring today, future helmApplications entries). Deliberately
#     has no cluster-scoped access.
# Neither project targets the argocd namespace as a destination -- only this
# chart's own Application-of-Applications bootstrapping lives there, and that
# isn't managed through either project.
argocd:
  namespace: argocd
  projects:
    infra:
      name: common-infra
      create: true
      description: Cluster-wide platform operators and CRDs bootstrapped by common-bootstrap
      sourceRepos:
        - https://github.com/philips-software/helm-charts
        - https://github.com/loafoe/crossplane-compositions
        - https://cloudnative-pg.io/charts/
        - https://grafana-community.github.io/helm-charts
        - oci://ghcr.io/philips-software/helm-charts/cloudnative-pg-operator
        - oci://ghcr.io/philips-software/helm-charts/*
        - ghcr.io/philips-software
      sourceNamespaces:
        - common-bootstrap
        - crossplane-system
        - cnpg-system
        - monitoring
      # Namespaces this project's Applications are allowed to deploy into.
      # Scoped to what's actually used across clusters today
      # (cloudnative-pg-operator, cloudnative-pg, crossplane-compositions),
      # plus crossplane-system for the planned esoIamResources HelmApplication
      # below, plus monitoring for the grafana bundle (charts/grafana) on
      # clusters like rpi homelab. That bundle's Crossplane providers
      # (provider-gf, provider-orgmapper) need a Provider package resource,
      # which is cluster-scoped -- it must stay on common-infra
      # (clusterResourceWhitelist '*'/'*'), not common-apps, which only
      # whitelists RBAC ClusterRole/ClusterRoleBinding.
      destinationNamespaces:
        - common-bootstrap
        - crossplane-system
        - cnpg-system
        - monitoring
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
    apps:
      name: common-apps
      create: true
      description: Namespaced workloads bootstrapped alongside common-infra
      sourceRepos:
        - https://github.com/grafana/k8s-monitoring-helm
        - https://grafana-community.github.io/helm-charts
        - https://grafana.github.io/helm-charts
        - oci://ghcr.io/philips-software/helm-charts/otlp-gateway
        - oci://ghcr.io/philips-software/helm-charts/grafana
        - oci://ghcr.io/philips-software/helm-charts/*
        - ghcr.io/philips-software
      sourceNamespaces:
        - k8s-observability-monitoring
        - otlp-gateway
        - monitoring
      destinationNamespaces:
        - k8s-observability-monitoring
        - otlp-gateway
        - monitoring
      # Grafana's k8s-monitoring chart (Alloy collectors) needs its own
      # ClusterRole/ClusterRoleBinding to scrape cluster-wide resources, so
      # this can't be empty -- but it's scoped to RBAC only, not '*'/'*'.
      clusterResourceWhitelist:
        - group: rbac.authorization.k8s.io
          kind: ClusterRole
        - group: rbac.authorization.k8s.io
          kind: ClusterRoleBinding

# HelmApplications to deploy via Crossplane composition
# These will be created after the EnvironmentConfig is ready
helmApplications: {}
  # External Secrets Operator IAM resources
  # esoIamResources:
  #  enabled: true
  #  name: eso-iam-resources
  #  namespace: crossplane-system
  #  project: common-bootstrap
  #  source:
  #    repoURL: oci://ghcr.io/philips-internal/helm-charts/dip-addons-eso-iam
  #    targetRevision: "0.1.0"
  #    helm:
  #      valuesObject: {}
  #      # Keys from EnvironmentConfig to include
  #      withConfigKeys:
  #        - resourcePrefix
  #        - awsRegion
  #        - awsAccountId


# Harvester Job configuration
harvester:
  enabled: true
  image:
    repository: docker.io/alpine/k8s
    # renovate: datasource=docker depName=alpine/k8s
    tag: "1.37.1"
    pullPolicy: IfNotPresent
  serviceAccount:
    name: hsp-addons-harvester
  ttlSecondsAfterFinished: 600
  # On a fresh cluster the source ConfigMap may be created by a later Argo CD sync
  # wave than this chart; wait this long for it before failing
  waitForConfigMapSeconds: 600
  # Bootstrap-critical: tolerate CriticalAddonsOnly so the Job can run on a tainted
  # control-plane/system node instead of waiting for the first worker node
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
  nodeSelector: {}

# StatefulSet immutable-field reconciler
#
# Recovers Argo CD Applications that are permanently wedged because an upstream
# chart bump changed an immutable StatefulSet field (serviceName, selector,
# podManagementPolicy, volumeClaimTemplates). The API server rejects the patch,
# Argo CD retries five times, gives up, and then will not retry again while the
# target revision is unchanged -- so the Application sits at OutOfSync/Healthy
# with its pods frozen on the old spec until someone intervenes by hand.
#
# Upstream's equivalent (the Loki chart's `statefulSetRecreateJob`) cannot help
# us: it is gated on Helm's `lookup`, which returns nothing under
# `helm template`, and Argo CD renders with `helm template`.
#
# This reconciler reacts to the error Argo CD already reported, then
# orphan-deletes the blocking StatefulSet and requests a resync. Orphan delete
# keeps the pods and PVCs running, so the recreated StatefulSet adopts them and
# there is no availability gap.
#
# Off by default: it deletes StatefulSets, so enable it per cluster
# deliberately. Pair it with the .github/check-statefulset-immutables.sh CI
# guard, which blocks these bumps before they ever reach a cluster.
statefulSetImmutableReconciler:
  enabled: false
  # How often to look for wedged Applications.
  schedule: "*/10 * * * *"
  # Log intended actions without deleting anything. Useful for a first rollout.
  dryRun: false
  # Allow acting on StatefulSets that have volumeClaimTemplates. Recreating
  # such a StatefulSet does NOT resize or migrate its existing PVCs, so leave
  # this off until you have confirmed the claims do not need expansion.
  allowVolumeClaimChanges: false
  # Restrict to specific Application names. Empty means all Applications.
  appFilter: []
  image:
    # renovate: datasource=docker depName=alpine/k8s
    tag: "1.37.1"

# Alerts for Argo CD Applications that have stopped converging.
#
# A failed sync that Argo CD has given up retrying leaves an Application at
# OutOfSync with health_status="Healthy" -- Healthy because the old pods still
# run fine. Nothing crashes, so conventional alerting never fires, and the
# workload quietly stops receiving updates. These rules alert on "not
# converging" rather than "unhealthy".
#
# Requires the Prometheus Operator CRDs (PrometheusRule) and Argo CD metrics
# being scraped, which the argocd-application-controller ServiceMonitor does.
argocdSyncAlerts:
  enabled: false
  # Namespace for the PrometheusRule. Defaults to argocd.namespace. Set this to
  # wherever your Prometheus is configured to discover rules.
  namespace: ""
  # Extra labels, e.g. a release label required by your Prometheus ruleSelector.
  additionalLabels: {}
  # How long an autosync-enabled Application may stay OutOfSync before warning.
  stuckFor: 1h
  # How long OutOfSync+Healthy must persist before treating it as frozen.
  frozenFor: 6h
  # Lookback window and pending period for failing sync operations.
  syncFailureWindow: 15m
  syncFailureFor: 10m
