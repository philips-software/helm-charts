{{- range $key, $project := .Values.argocd.projects }}
{{- if $project.create }}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ $project.name }}
  namespace: {{ $.Values.argocd.namespace }}
  labels:
    {{- include "common-bootstrap.labels" $ | nindent 4 }}
spec:
  clusterResourceWhitelist:
    {{- toYaml $project.clusterResourceWhitelist | nindent 4 }}
  description: {{ $project.description }}
  destinations:
    {{- range $project.destinationNamespaces }}
    - name: in-cluster
      namespace: {{ . }}
      server: https://kubernetes.default.svc
    {{- end }}
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  sourceNamespaces:
    {{- toYaml $project.sourceNamespaces | nindent 4 }}
  sourceRepos:
    {{- toYaml $project.sourceRepos | nindent 4 }}
{{- end }}
{{- end }}
