# -- Cluster name for telemetry labeling. Must be set to a non-empty value at install time.
clusterName: ""

# -- ArgoCD project name for the k8s-monitoring Application
project:
  name: "default"

# -- Override the upstream chart version (defaults to appVersion in Chart.yaml)
chart:
  version: ""

# -- OTLP destinations where telemetry data will be sent.
# Each destination is a map entry with the destination name as key.
# See: https://github.com/grafana/k8s-monitoring-helm/blob/main/charts/k8s-monitoring/docs/destinations/README.md
#
# Set customAlloyOnly: true to exclude a destination from the upstream k8s-monitoring chart
# (it will only be used by customAlloy). tenantId (X-Scope-OrgID), insecure and
# insecureSkipVerify apply to both customAlloy and upstream, so a no-auth customAlloyOnly
# destination can drop the flag and be used by the upstream collectors instead.
#
# Example:
#   destinations:
#     otlpGateway:
#       type: otlp
#       url: "https://otlp-gateway.example.com/otlp"
#       protocol: http
#       auth:
#         type: basic
#         usernameKey: "username"
#         passwordKey: "apiKey"
#       secret:
#         create: false
#         name: "otlp-gateway-creds"
#       metrics:
#         enabled: true
#       logs:
#         enabled: true
#       traces:
#         enabled: true
#       processors:
#         batch:
#           enabled: true
#           size: 2000
#       sendingQueue:
#         enabled: true
#         queueSize: 100
destinations: {}

# -- SPIFFE authentication configuration
# When enabled, adds spiffe-helper sidecar to customAlloy for JWT token refresh.
# For destinations using SPIFFE, set auth.type: bearerToken with bearerTokenFile.
spiffe:
  enabled: false
  trustDomain: ""
  audience: ""
  jwtPath: /var/run/secrets/spiffe/jwt/token
  # -- Upstream collectors that should receive the spiffe-helper sidecar so they can
  # authenticate to SPIFFE (bearerToken) destinations. Valid values: alloy-logs,
  # alloy-receiver, alloy-metrics. Replaces the manual collectorCommon sidecar injection.
  collectors: []
  helper:
    # renovate: datasource=docker depName=ghcr.io/spiffe/spiffe-helper
    image: ghcr.io/spiffe/spiffe-helper:0.12.2
    resources:
      requests:
        cpu: 1m
        memory: 16Mi
      limits:
        memory: 32Mi

# -- Prometheus Operator Objects (ServiceMonitors, PodMonitors, Probes)
prometheusOperatorObjects:
  enabled: true
  # -- Destinations to send metrics. Empty = all metrics-capable destinations.
  destinations: []
  # -- Allow Alloy's ServiceMonitor discovery (prometheus.operator.servicemonitors only --
  # the PodMonitors/Probes components don't support this attribute) to honor bearerTokenFile
  # (a path on Alloy's own filesystem, e.g. its mounted serviceaccount token). Required for
  # kube-prometheus-stack's built-in system ServiceMonitors (kube-apiserver, kube-scheduler,
  # kube-controller-manager, kube-etcd, coredns, kube-proxy, kubelet), which all use this
  # pattern. Without it, Alloy silently drops those ServiceMonitors ("error generating
  # scrapeconfig ... disallowed because allow_arbitrary_file_access is false") and their
  # metrics never reach any destination -- even though `up` is unaffected, the underlying
  # component-specific metrics (e.g. apiserver_request_total) are simply never scraped.
  allowArbitraryFileAccess: true
  serviceMonitors:
    # -- Label expressions to filter which ServiceMonitors to scrape.
    labelExpressions: []
    # -- Extra discovery rules for ServiceMonitors (Alloy relabel config syntax).
    extraDiscoveryRules: ""
    # -- Extra metric processing rules (Alloy relabel config syntax).
    extraMetricProcessingRules: ""
    # -- Metrics tuning to filter metrics.
    metricsTuning:
      # -- Metrics to exclude. Can use regular expressions.
      # Example: ["apiserver_request_duration_seconds_bucket"]
      excludeMetrics: []

# -- Cluster metrics (kubelet, cadvisor, kube-state-metrics, control plane, ...) scraped by the
# upstream alloy-metrics collector -- the replacement for customAlloy (see "Retiring customAlloy"
# in the README). Keys other than the ones below (cadvisor, apiServer, kubeDNS, ...) are
# passed through to upstream clusterMetrics verbatim when enabled.
clusterMetrics:
  enabled: false
  destinations: []
  kubelet:
    enabled: true
    nodeAddressFormat: direct
    metricsTuning:
      useDefaultAllowList: true
  kubeletResource:
    enabled: true
    nodeAddressFormat: direct
  # -- Upstream kube-state-metrics scrape settings, passed through (namespace, labelMatchers,
  # metricsTuning, extraMetricProcessingRules, ...). The chart always prepends two relabel rules
  # that rename KSM's webhook `service_name`/`service_namespace` labels to `webhook_service_*`:
  # left alone, upstream's OTLP destination copies them onto the scrape's resource and every KSM
  # series gets a garbage job label (e.g. `kyverno/vpa-webhook`). The upstream default allow list
  # drops those series anyway; the rules matter once useDefaultAllowList is false.
  # Requires telemetryServices.kube-state-metrics.deploy, or pointing at an existing instance:
  #   kube-state-metrics:
  #     namespace: prometheus          # e.g. kube-prometheus-stack's kube-state-metrics
  #     labelMatchers:
  #       app.kubernetes.io/name: kube-state-metrics
  #     metricsTuning:
  #       useDefaultAllowList: false   # full metric set, like customAlloy
  kube-state-metrics: {}

# -- Pod logs collection via Loki format
podLogsViaLoki:
  enabled: true
  destinations: []
  # -- Drop kube-probe logs (liveness/readiness probe requests).
  dropKubeProbe: false
  # -- Namespaces to exclude from log collection.
  excludeNamespaces: []

# -- Cilium Hubble L7 flow/access logs collection.
# Tails Cilium's flow export file on each node (via the alloy-logs DaemonSet) and ships it to
# a destination as OTLP logs. The chart does NOT configure Cilium: the operator must enable
# hubble.export on the Cilium side (file path below + allowlist event_type 129).
# Requires alloy-logs to have SPIFFE auth if a target destination uses bearerToken auth:
# add "alloy-logs" to spiffe.collectors.
hubbleFlowLogs:
  enabled: false
  # -- Cilium hubble-export-file-path. The chart mounts this file's parent dir read-only.
  exportFilePath: /var/run/cilium/hubble/events.log
  # -- Destinations to ship flows to. Empty = reuse the destinations resolved for podLogsViaLoki.
  destinations: []
  # -- Max OTLP batch size for flows. Hubble flow JSON is large (~4.5 KB/flow); keep batches
  # under the gateway's gRPC receive limit (commonly 4 MB). 512 ~= 2.3 MB.
  batchMaxSize: 512

# -- Application observability (OTLP receiver for traces, metrics, logs from apps)
applicationObservability:
  enabled: false
  destinations: []
  receivers:
    otlp:
      grpc:
        enabled: true
        port: 4317
      http:
        enabled: true
        port: 4318
  # -- Processor settings passed through verbatim to the upstream
  # applicationObservability feature (see its values for the full list). E.g. a
  # memory limiter right after the OTLP receiver of alloy-receiver, which pushes
  # back on senders with a retryable error instead of letting the collector OOM:
  #   processors:
  #     memoryLimiter:
  #       enabled: true
  #       checkInterval: 1s
  #       limit: 400MiB   # upstream only supports an absolute limit; keep it below
  #                       # the alloy-receiver container memory limit
  processors: {}

# -- Auto-instrumentation for applications
autoInstrumentation:
  enabled: false
  destinations: []

# -- Telemetry services deployment flags
telemetryServices:
  kube-state-metrics:
    deploy: false
  node-exporter:
    deploy: false

# -- Toleration for the platform's "dedicated node" taint key (e.g. the kafka/tempo-kafka
# dedicated nodes created by mimir-bootstrap/tempo-bootstrap's kafkaNodePool), so the
# DaemonSets this chart deploys -- alloy-logs for node logs, and node-exporter for host
# metrics when enabled -- still land on those nodes. Defaults to operator: Exists (no
# value match) since different bootstrap charts taint their dedicated nodes with different
# values under the same key (mimir-bootstrap: "kafka", tempo-bootstrap: "tempo-kafka") --
# matching on the key alone covers all of them, including any added in the future, without
# further chart changes. Set operator: Equal and value: <taint-value> to match one value only.
dedicatedNodeToleration:
  enabled: true
  key: cilium.hsp.philips.com/dedicated
  operator: Exists
  value: ""
  effect: NoSchedule

# -- PriorityClass for the per-node DaemonSets this chart deploys: alloy-logs, and
# node-exporter when telemetryServices.node-exporter.deploy is true. Defaults to the built-in
# system-node-critical, matching the platform's own per-node agents (fluent-bit,
# kps-node-exporter, spire-agent, cilium): a DaemonSet pod with the default priority 0 can't
# preempt anything, so on a full node (e.g. a fresh Karpenter node packed before the
# DaemonSet pod lands) it stays Pending and that node's logs are silently never collected.
# A per-collector collectors.alloy-logs.controller.priorityClassName still takes precedence.
# Set to "" to leave the pods at the cluster default priority.
daemonSetPriorityClassName: system-node-critical

# -- Common collector settings (applies to all Alloy instances managed by operator).
# NOTE: collectorCommon.alloy is merged at the *top level* of each Alloy custom resource's spec
# (siblings: alloy, controller, ...) -- see grafana/k8s-monitoring-helm collector.alloy.values.
# That means resources must be nested under an inner `alloy:` key (collectorCommon.alloy.alloy.resources),
# not collectorCommon.alloy.resources directly, or they silently land on an unknown top-level field and
# are dropped -- each managed collector then falls back to its preset's resources instead.
collectorCommon:
  alloy:
    alloy:
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi
    # -- Controller settings for pod scheduling and autoscaling
    controller:
      # -- Node affinity to prevent DaemonSets from scheduling on Fargate nodes.
      # Fargate doesn't support DaemonSets, so we exclude nodes with eks.amazonaws.com/compute-type=fargate.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: eks.amazonaws.com/compute-type
                    operator: NotIn
                    values:
                      - fargate
      # -- VerticalPodAutoscaler for upstream-managed collectors (alloy-metrics, alloy-logs,
      # alloy-receiver), using the Alloy Operator's native VPA support -- no custom template needed.
      # Disabled by default: unlike customAlloy (opt-in feature, so its VPA default-on only affects
      # clusters that already enabled it), alloy-metrics/alloy-logs are core collectors enabled on
      # every install, and this requires the VPA CRD to be present in the cluster. Enable per-cluster
      # once the VPA CRD is confirmed installed.
      autoscaling:
        vertical:
          enabled: false
          updatePolicy:
            updateMode: "Auto"
          resourcePolicy:
            containerPolicies:
              - containerName: alloy
                controlledResources:
                  - memory
                minAllowed:
                  memory: 256Mi
                maxAllowed:
                  memory: 4Gi

# -- Per-collector settings (overrides collectorCommon for specific collectors)
# Available collectors: alloy-logs, alloy-metrics, alloy-receiver
collectors:
  alloy-logs:
    alloy:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi

# -- Custom Alloy deployment for kube-state-metrics scraping
# Deploys separate Alloy instance with OTEL pipeline for metrics.
# This is preserved from v3.x to maintain the workaround for duplicate job labels.
customAlloy:
  enabled: false
  # -- Replace upstream alloy-metrics collector entirely.
  replaceUpstreamCollector: false
  replicas: 1
  clustering:
    enabled: false
  liveDebugging:
    enabled: true
  sendingQueue:
    enabled: true
    queueSize: 500
    numConsumers: 10
  # -- Optional otelcol.processor.memory_limiter at the head of the OTEL pipeline
  # (receiver.prometheus -> memory_limiter -> transform -> batch -> exporters), so it
  # also covers anything extraConfig forwards into the receiver. Above the soft limit
  # (limit minus spike) it refuses incoming data; above the hard limit it forces a
  # GC. Scrapes are pull-based, so refused samples are dropped rather than retried:
  # it trades gaps in the data for not being OOMKilled (and losing the WAL and
  # sending queue with it).
  memoryLimiter:
    enabled: false
    # -- How often memory usage is checked.
    checkInterval: 1s
    # -- Percentage mode (used when limit is empty): hard limit as a % of the
    # container memory limit, so it follows customAlloy.resources.limits.memory and
    # VPA changes to it. Read once at component start: an in-place VPA resize
    # takes effect on the next pod restart. Requires a container memory limit.
    limitPercentage: 80
    # -- Percentage mode: spike headroom (% of the container memory limit). The
    # soft limit is limitPercentage - spikeLimitPercentage. Must be below limitPercentage.
    spikeLimitPercentage: 20
    # -- Absolute mode: fixed hard limit (e.g. "1600MiB"). When set it replaces the
    # percentage pair (Alloy accepts one mode or the other, not both). Keep it
    # below the container memory limit, and remember VPA can change that limit.
    limit: ""
    # -- Absolute mode: spike headroom (e.g. "320MiB"). Empty = Alloy's default, 20% of limit.
    spikeLimit: ""
  attributeCleanup:
    enabled: true
  attributePromotion:
    enabled: false
  kubeStateMetrics:
    extraMetricProcessingRules: ""
    # -- Restrict kube-state-metrics discovery to a single namespace. Empty
    # (default) discovers any kube-state-metrics-labeled endpoint cluster-wide,
    # which double-counts every series if more than one instance exists (e.g.
    # this chart's own, deployed via telemetryServices.kube-state-metrics,
    # alongside a platform-managed one). Set to the namespace of the instance
    # you want scraped once you have exactly one you intend to use.
    namespace: ""
  nodeExporter:
    extraMetricProcessingRules: ""
  kubelet:
    enabled: false
  # -- Raw Alloy configuration appended verbatim to the custom Alloy config.alloy.
  # Use it to add pipelines the chart does not model, e.g. a prometheus.scrape
  # of targets outside the cluster. Forward metrics to
  # otelcol.receiver.prometheus.default.receiver to reuse the chart's OTLP
  # pipeline (batching, auth, destinations). Not passed through tpl.
  # When clustering.enabled is true, add `clustering { enabled = true }` to
  # scrape blocks so the targets are sharded across replicas instead of being
  # scraped once per replica.
  extraConfig: ""
  # -- Liveness probe for the alloy container. timeoutSeconds defaults to 5 (not
  # Kubernetes' implicit 1s) because this single binary also runs OTLP export
  # queues/retries and (when clustering is enabled) gossip -- a busy retry loop
  # against a slow/unhealthy destination can otherwise delay the health handler
  # past a 1s budget and trip the probe even though alloy itself is fine.
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  # -- Readiness probe for the alloy container. Same timeoutSeconds rationale
  # as livenessProbe above.
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 2Gi
  # -- PriorityClass for the customAlloy pods. Empty (default) leaves them at the
  # cluster default priority, like the upstream alloy-metrics/alloy-receiver collectors.
  priorityClassName: ""
  # -- VerticalPodAutoscaler for customAlloy. Enabled by default: clustering
  # deployments outgrow the static requests under real metric volume and OOMKill
  # at fixed limits. VPA (memory-only) right-sizes them within min/maxAllowed.
  # maxAllowed is deliberately capped well below the admission controller's old
  # 8Gi ceiling: a single stale/transient memory peak (e.g. a WAL or ingest
  # burst) could otherwise drive the recommender target -- and thus the live
  # request/limit -- up to that ceiling and keep it there long after the spike
  # passed, even though steady-state usage is under 1Gi. 2Gi still leaves
  # headroom above observed usage for genuine growth before it needs revisiting.
  vpa:
    enabled: true
    updateMode: "InPlaceOrRecreate"
    minAllowed:
      memory: 512Mi
    maxAllowed:
      memory: 2Gi

# -- Kyverno PolicyException configuration
kyverno:
  policyException:
    enabled: false
    policyName: "enforce-baseline-pod-security-profile"
    ruleNames:
      - "enforce-baseline-profile"
