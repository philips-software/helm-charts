cnpgChart:
  # renovate: datasource=helm depName=cloudnative-pg registryUrl=https://cloudnative-pg.io/charts
  version: 0.29.1

# These values are injected by the HelmApplication
environmentConfig:
  resourcePrefix: ""
  sharedServicesAccountId: ""
  region: ""

argoProject: common-infra

operator:
  fullnameOverride: cloudnative-pg
  namespace: cnpg-system
  # Enable hostNetwork if the K3s/K8s control plane cannot reach the pod network
  # (e.g., when running K3s server with --disable-agent)
  hostNetwork: false
  # DNS policy for the operator pod. Only relevant together with
  # hostNetwork: true, where Kubernetes otherwise makes the pod use the NODE's
  # resolver instead of the cluster's.
  #
  # A hostNetwork operator that has to resolve a cluster Service - the
  # barman-cloud plugin, for one - cannot, because the node's resolver knows
  # nothing about cluster.local. The operator then fails with
  # "name resolver error: produced zero addresses" and the whole Cluster
  # reconciliation stops, not just the backup.
  #
  # "ClusterFirstWithHostNet" makes the pod use the CLUSTER's DNS while
  # keeping the host network. "" leaves it unset.
  dnsPolicy: ""
  # Update strategy for the operator Deployment.
  #
  # Set this to {type: Recreate} when hostNetwork is on. A hostNetwork pod
  # binds the node's ports, and the default RollingUpdate creates the new pod
  # BEFORE the old one is terminated - so the new pod cannot get the ports and
  # the rollout deadlocks with
  #   "0/4 nodes are available: 4 node(s) didn't have free ports for the
  #    requested pod ports"
  # and never completes on its own. Recreate terminates the old pod first.
  # {} leaves the chart's default alone.
  updateStrategy: {}
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 5m
      memory: 64Mi
  tolerations: []
  # Example:
  # tolerations:
  #   - key: "CriticalAddonsOnly"
  #     operator: "Exists"
  #     effect: "NoSchedule"

imageCatalog:
  enabled: true
  name: default
  images:
    # "standard" flavor (not "system", which is deprecated upstream and lacks
    # extensions) bundles pgvector, pgaudit, failover slots and full locales.
    # Backups go through barmanCloudPlugin, so the "system" flavor's bundled
    # barman-cloud binaries aren't needed anyway.
    - major: 18
      # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
      image: "${sharedServicesAccountId}.dkr.ecr.${region}.amazonaws.com/github/cloudnative-pg/postgresql:18.6-standard-trixie"

kyvernoPolicy:
  enabled: true
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/cloudnative-pg
  operatorImage: "${sharedServicesAccountId}.dkr.ecr.${region}.amazonaws.com/github/cloudnative-pg/cloudnative-pg:1.30.1"

barmanCloudPlugin:
  enabled: true
  # renovate: datasource=helm depName=plugin-barman-cloud registryUrl=https://cloudnative-pg.io/charts
  version: 0.8.1

volumeSnapshotPruner:
  # CNPG's backup.volumeSnapshot method has no retention policy of its own
  # (retentionPolicy only applies to the barmanObjectStore method) and the
  # Kubernetes VolumeSnapshot API has no TTL/expiry field either, so without
  # this, every scheduled volumeSnapshot backup's Backup + VolumeSnapshot
  # (and its underlying cloud snapshot) accumulates forever.
  enabled: true
  # Delete any CNPG-created VolumeSnapshot (and its matching same-named
  # Backup) older than this many days, cluster-wide, across every
  # namespace. Opt a specific snapshot out with the annotation
  # cnpg-volumesnapshot-pruner.philips-software.io/keep: "true".
  retentionDays: 14
  schedule: "45 3 * * *"
  # renovate: datasource=docker depName=alpine/k8s
  image: "alpine/k8s:1.37.1"
