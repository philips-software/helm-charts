# Crossplane Providers Configuration
# This Helm chart deploys AWS Crossplane providers with IRSA (IAM Roles for Service Accounts) configuration

# =============================================================================
# REQUIRED CONFIGURATION
# All values under 'environmentConfig' are mandatory and must be provided
# =============================================================================
environmentConfig:

  
  # AWS Account ID where resources will be created
  # Example: "123456789012"
  accountId: ""
  
  # Prefix for AWS resources (especially IAM roles)
  # This helps organize and identify resources created by this chart
  # Example: "my-project", "dev-env", "prod-crossplane"
  resourcePrefix: ""
  
  # ARN of the OIDC Identity Provider for your Kubernetes cluster
  # This is required for IRSA (IAM Roles for Service Accounts) functionality
  # Format: "arn:aws:iam::<account-id>:oidc-provider/<oidc-provider-url>"
  # Example: "arn:aws:iam::123456789012:oidc-provider/oidc.eks.us-west-2.amazonaws.com/id/ABCDEF1234567890"
  oidcProviderArn: ""
  
  # OIDC Provider URL for your Kubernetes cluster (without https:// prefix)
  # This is used in the IAM trust policy for provider service accounts
  # Required only when identityMode is "irsa" (the default).
  # Format: "oidc.eks.<region>.amazonaws.com/id/<cluster-id>"
  # Example: "oidc.eks.us-west-2.amazonaws.com/id/ABCDEF1234567890"
  oidcProvider: ""

  # EKS cluster name. Required only when identityMode is "podIdentity"
  # (used to create the PodIdentityAssociation).
  clusterName: ""

  # AWS region of the cluster. Required only when identityMode is "podIdentity"
  # (the region the PodIdentityAssociation is created in).
  region: ""

# =============================================================================
# CROSSPLANE PROVIDERS CONFIGURATION
# =============================================================================
# Package configuration for all AWS providers
package:
  # Version tag for all AWS providers
  # This should match a valid Crossplane provider version
  # renovate: datasource=github-releases depName=crossplane-contrib/provider-upjet-aws
  version: "v2.9.0"
  
  # Container registry where provider images are hosted
  # Default is the official Crossplane Contrib registry
  registry: "xpkg.crossplane.io/crossplane-contrib"
  
  # Kubernetes namespace where Crossplane is installed
  # This is typically "crossplane-system" for standard installations
  namespace: "crossplane-system"

  # How provider ServiceAccounts obtain AWS credentials. One of:
  #   irsa        - IAM Roles for Service Accounts via OIDC (default). Requires
  #                 environmentConfig.oidcProviderArn + oidcProvider.
  #   podIdentity - EKS Pod Identity. Requires environmentConfig.clusterName +
  #                 region; creates a PodIdentityAssociation per provider and
  #                 omits the IRSA role-arn annotation.
  # Can be overridden per provider with `identityMode` on a providers/
  # extraProviders entry.
  identityMode: "irsa"

  # When true, annotates each Provider with argocd.argoproj.io/sync-options: Delete=false
  # so ArgoCD will NOT prune the live Provider if the parent Application is deleted.
  # This prevents the deadlock where cascade-deleting a Provider (whose controller pod
  # is gone) leaves managed-resource finalizers and foregroundDeletion unprocessable.
  # Set to false if you want Application deletion to also remove the Provider.
  protectProvider: true

  # Number of Inactive ProviderRevisions crossplane retains after a package
  # version/registry change (e.g. a version bump, or a registry migration like
  # xpkg.upbound.io -> ghcr.io). Crossplane semantics, straight from the
  # Provider CRD: "Defaults to 1. Can be disabled by explicitly setting to 0."
  # 0 does NOT mean "keep none" -- it DISABLES garbage collection entirely, so
  # Inactive revisions accumulate forever. There is no value that keeps zero:
  # 1 retains one Inactive revision, and that is the minimum.
  #
  # 1 requires Crossplane >= v2.4.0. Before v2.4.0 a lingering Inactive revision
  # deletes the runtime Deployment by the name this chart pins via
  # deploymentTemplate.metadata.name, WITHOUT checking that the Deployment is
  # owned by that revision. Because every revision resolves to that same stable
  # name, the Inactive revision deleted the Active revision's Deployment, which
  # was then recreated: a new ReplicaSet every ~15-20min, invalidating the
  # apiserver's ReplicaSet watch cache and producing etcd write-lock contention
  # and latency spikes on a 3-node control plane. Crossplane v2.4.0 added the
  # ownership check (PR #7561, commit 752efb7799), which makes a lingering
  # Inactive revision harmless. See infra/kmaster-tuning/etcd-latency-spikes.md
  # in the k3s homelab repo.
  revisionHistoryLimit: 1

  # Periodic CronJob that cleans up after the class of problem documented above:
  # stuck ProviderRevisions, CRDs with a stale ProviderRevision ownerReference,
  # and stray runtime Deployments left behind by a chart naming change. Off by
  # default -- this exists for the migration window around a version/registry
  # change, not as a permanent fixture, so it isn't left running indefinitely.
  cleanupJob:
    enabled: false
    # Standard 5-field cron schedule, evaluated in the cluster's local time zone.
    schedule: "*/15 * * * *"

# Additional providers to deploy (beyond the built-in AWS Family provider)
# These providers follow the same structure as the main providers array
# Each provider will create:
# - Provider resource (Crossplane provider installation)
# - DeploymentRuntimeConfig (runtime configuration with optional IRSA)
# - IAM Role (only if managedPolicyArns contains entries and no roleArn is specified)
#
# Example usage:
# extraProviders:
#   - name: provider-aws-lambda
#     enabled: true
#     managedPolicyArns:
#       - "arn:aws:iam::aws:policy/AWSLambda_FullAccess"
#   - name: provider-aws-apigateway
#     enabled: true
#     managedPolicyArns:
#       - "arn:aws:iam::aws:policy/AmazonAPIGatewayAdministrator"
extraProviders: []

# List of AWS providers to deploy
# Each provider will create:
# - Provider resource (Crossplane provider installation)
# - DeploymentRuntimeConfig (runtime configuration with optional IRSA)
# - IAM Role (only if managedPolicyArns contains entries and no roleArn is specified)
providers:
  - name: provider-family-aws
    enabled: true
  - name: provider-aws-s3
    # Whether to deploy this provider (optional, defaults to true)
    # Set to false to skip deployment of this provider
    enabled: true
    # Enable debug logging for this provider (optional, defaults to false)
    # debug: true
    # List of AWS managed policy ARNs to attach to the IAM role
    # These policies determine what AWS permissions the provider will have
    # If empty or omitted, no IAM role will be created and no IRSA annotation will be added
    managedPolicyArns:
      - "arn:aws:iam::aws:policy/AmazonS3FullAccess"
    resources:
      requests:
        cpu: 40m
        memory: 320Mi
      limits:
        memory: 640Mi
  # AWS RDS Provider  
  - name: provider-aws-rds
    # Whether to deploy this provider (optional, defaults to true)
    enabled: true
    # AWS managed policies for RDS operations
    managedPolicyArns:
      - "arn:aws:iam::aws:policy/AmazonRDSFullAccess"

  # AWS KMS Provider
  - name: provider-aws-kms
    enabled: true
    policy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": [
              "kms:UntagResource",
              "kms:TagResource",
              "kms:ScheduleKeyDeletion",
              "kms:ListRetirableGrants",
              "kms:ListKeys",
              "kms:ListAliases",
              "kms:List*",
              "kms:Get*",
              "kms:GenerateRandom",
              "kms:DescribeCustomKeyStores",
              "kms:Describe*",
              "kms:DeleteAlias",
              "kms:CreateKey",
              "kms:CreateAlias"
            ],
            "Resource": "*"
          }
        ]
      }

# =============================================================================
# ADDITIONAL PROVIDER EXAMPLES
# =============================================================================
# You can add more providers by following the same pattern:
#
#   - name: provider-aws-ec2
#     enabled: true
#     managedPolicyArns:
#       - "arn:aws:iam::aws:policy/AmazonEC2FullAccess"
#
#   - name: provider-aws-iam
#     enabled: false  # This provider will be skipped
#     managedPolicyArns:
#       - "arn:aws:iam::aws:policy/IAMFullAccess"
#
#   - name: provider-aws-eks
#     # enabled defaults to true when omitted
#     managedPolicyArns:
#       - "arn:aws:iam::aws:policy/AmazonEKSClusterPolicy"
#       - "arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy"
#
#   - name: provider-with-external-role
#     enabled: true
#     # Use an externally managed role instead of creating one
#     roleArn: "arn:aws:iam::123456789012:role/my-external-crossplane-role"
#
#   - name: provider-custom-no-irsa
#     enabled: true
#     # No managedPolicyArns and no roleArn - will not create IAM role or IRSA annotation
#     # Useful for providers that don't need AWS permissions
#
#   - name: provider-aws-ec2
#     enabled: true
#     # Override the chart-level package.identityMode for just this provider.
#     # Requires environmentConfig.clusterName + region.
#     identityMode: podIdentity
#     policy: |
#       { "Version": "2012-10-17", "Statement": [ ... ] }
#
# =============================================================================
# IMPORTANT NOTES
# =============================================================================
# 1. All 'environmentConfig' values are mandatory - the chart will fail if any are empty
# 2. IAM roles are only created when managedPolicyArns contains entries AND no roleArn is specified
# 3. When roleArn is provided, the external role is used and no IAM role is created
# 4. IRSA annotations are added when either roleArn is provided OR IAM roles are created
# 5. IAM roles created will be named: {resourcePrefix}-{provider-name}
# 6. Each provider gets its own dedicated IAM role with only necessary permissions
# 7. The OIDC configuration enables secure, keyless authentication to AWS
# 8. Provider images are pulled from the specified registry with the package version
# 9. All resources are deployed to the specified namespace (typically crossplane-system)
# 10. Set 'debug: true' on any provider to enable verbose debug logging
