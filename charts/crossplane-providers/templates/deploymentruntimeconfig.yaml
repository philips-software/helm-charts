{{- range concat .Values.providers .Values.extraProviders }}
{{- $mode := .identityMode | default $.Values.package.identityMode | default "irsa" }}
{{- if not (eq (.enabled | toString) "false") }}
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.package.namespace }}
  labels:
    {{- include "crossplane-providers.labels" $ | nindent 4 }}
spec:
  deploymentTemplate:
    metadata:
      name: {{ .name }}
    spec:
      replicas: 1
      selector: {}
      template:
        spec:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: package-runtime
              {{- if .debug }}
              args:
                - --debug
              {{- end }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
              resources:
                {{- if .resources }}
                {{- toYaml .resources | nindent 16 }}
                {{- else }}
                limits:
                  memory: 560Mi
                requests:
                  cpu: 40m
                  memory: 320Mi
                {{- end }}
  {{- if .pinServiceAccountName }}
  serviceAccountTemplate:
    metadata:
      # Pin a stable ServiceAccount name, independent of the package's
      # per-revision hash suffix, so a durable ClusterRoleBinding (granting
      # e.g. cross-provider RBAC this provider needs to read another
      # provider's CRDs) survives package upgrades instead of going stale
      # every time the provider's image digest -- and thus its default
      # ServiceAccount name -- changes.
      name: {{ .name }}
  {{- else if or (.roleArn) (and (.managedPolicyArns) (gt (len .managedPolicyArns) 0)) (.policy) }}
  serviceAccountTemplate:
    metadata:
      {{- if eq $mode "podIdentity" }}
      # Pin a stable ServiceAccount name so the PodIdentityAssociation can target
      # it. Pod Identity does not use the IRSA role-arn annotation.
      name: {{ .name }}
      {{- else }}
      annotations:
        {{- if .roleArn }}
        eks.amazonaws.com/role-arn: {{ .roleArn }}
        {{- else }}
        eks.amazonaws.com/role-arn: arn:aws:iam::{{ $.Values.environmentConfig.accountId }}:role/{{ $.Values.environmentConfig.resourcePrefix }}-{{ .name }}
        {{- end }}
      {{- end }}
  {{- end }}
{{- end }}
{{- end }}