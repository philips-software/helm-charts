{{- if .Values.vpa.enabled }}
{{- range concat .Values.providers .Values.extraProviders }}
{{- if not (eq (.enabled | toString) "false") }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ .name }}-vpa
  namespace: {{ $.Values.package.namespace }}
  annotations:
    # VPA CRDs come from the vertical-pod-autoscaler app (sync wave 21); without this a
    # fresh cluster fails validation of this whole app until then, which also blocks the
    # ProviderConfig/ClusterProviderConfig this provider installs and everything after them.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    {{- include "crossplane-providers.labels" $ | nindent 4 }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    # Crossplane's package manager creates the actual Deployment from this
    # provider's DeploymentRuntimeConfig, using the same name.
    name: {{ .name }}
  updatePolicy:
    minReplicas: {{ $.Values.vpa.minReplicas }}
    updateMode: {{ $.Values.vpa.updateMode | quote }}
  resourcePolicy:
    containerPolicies:
      - containerName: package-runtime
        minAllowed:
          cpu: {{ $.Values.vpa.minAllowed.cpu }}
          memory: {{ $.Values.vpa.minAllowed.memory }}
        maxAllowed:
          cpu: {{ $.Values.vpa.maxAllowed.cpu }}
          memory: {{ $.Values.vpa.maxAllowed.memory }}
        controlledResources: ["cpu","memory"]
        # RequestsOnly, matching the lesson learned on centcom-satellite
        # (chart 0.69.0): RequestsAndLimits scales resources.limits.memory to
        # the VPA's typical-usage target, which a percentile-based
        # recommender can set *below* the explicit, deliberately-raised
        # static limit and reintroduce the exact OOM this is meant to
        # prevent on the next rare spike. The static limit above
        # (deploymentruntimeconfig.yaml / this provider's `resources` value)
        # stays the real OOM ceiling; the VPA only right-sizes requests.
        controlledValues: {{ $.Values.vpa.controlledValues | default "RequestsOnly" }}
{{- end }}
{{- end }}
{{- end }}
