{{- if and .Values.aws.irsa.enabled (not .Values.aws.irsa.roleArnOverride) }}
{{- $top := . }}
{{- /* Attach the built-in CloudWatch RCA policy only when that feature is on. */ -}}
{{- if .Values.features.cloudwatchRca }}
apiVersion: iam.aws.m.upbound.io/v1beta1
kind: RolePolicyAttachment
metadata:
  name: {{ include "centcom-satellite.irsaName" . }}-cw-rca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "centcom-satellite.labels" . | nindent 4 }}
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: {{ .Values.aws.irsa.providerConfigRef }}
  forProvider:
    roleRef:
      name: {{ include "centcom-satellite.irsaRoleName" . }}
    policyArnRef:
      name: {{ include "centcom-satellite.irsaName" . }}-cw-rca
{{- end }}
{{- /* Attach the read-only GuardDuty policy only when that feature is on. */ -}}
{{- if .Values.features.guardduty }}
---
apiVersion: iam.aws.m.upbound.io/v1beta1
kind: RolePolicyAttachment
metadata:
  name: {{ include "centcom-satellite.irsaName" . }}-guardduty
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "centcom-satellite.labels" . | nindent 4 }}
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: {{ .Values.aws.irsa.providerConfigRef }}
  forProvider:
    roleRef:
      name: {{ include "centcom-satellite.irsaRoleName" . }}
    policyArnRef:
      name: {{ include "centcom-satellite.irsaName" . }}-guardduty
{{- end }}
{{- /* Attach the read-only Security Hub policy when either the read or write feature is on — write implies read (it's a read+write capability, not a write-only add-on). */ -}}
{{- if or .Values.features.securityhub .Values.features.securityhubWrite }}
---
apiVersion: iam.aws.m.upbound.io/v1beta1
kind: RolePolicyAttachment
metadata:
  name: {{ include "centcom-satellite.irsaName" . }}-securityhub
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "centcom-satellite.labels" . | nindent 4 }}
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: {{ .Values.aws.irsa.providerConfigRef }}
  forProvider:
    roleRef:
      name: {{ include "centcom-satellite.irsaRoleName" . }}
    policyArnRef:
      name: {{ include "centcom-satellite.irsaName" . }}-securityhub
{{- end }}
{{- /* Attach the write-only Security Hub policy (BatchUpdateFindings) only when that feature is on. */ -}}
{{- if .Values.features.securityhubWrite }}
---
apiVersion: iam.aws.m.upbound.io/v1beta1
kind: RolePolicyAttachment
metadata:
  name: {{ include "centcom-satellite.irsaName" . }}-securityhub-write
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "centcom-satellite.labels" . | nindent 4 }}
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: {{ .Values.aws.irsa.providerConfigRef }}
  forProvider:
    roleRef:
      name: {{ include "centcom-satellite.irsaRoleName" . }}
    policyArnRef:
      name: {{ include "centcom-satellite.irsaName" . }}-securityhub-write
{{- end }}
{{- /* Attach the cross-account AssumeRole policy only when a target roleArn is configured. */ -}}
{{- if .Values.aws.assumeRole.roleArn }}
---
apiVersion: iam.aws.m.upbound.io/v1beta1
kind: RolePolicyAttachment
metadata:
  name: {{ include "centcom-satellite.irsaName" . }}-assumerole
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "centcom-satellite.labels" . | nindent 4 }}
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: {{ .Values.aws.irsa.providerConfigRef }}
  forProvider:
    roleRef:
      name: {{ include "centcom-satellite.irsaRoleName" . }}
    policyArnRef:
      name: {{ include "centcom-satellite.irsaName" . }}-assumerole
{{- end }}
{{- /*
Attach any additional pre-existing managed-policy ARNs to the same role. This is
how future task groups that need extra IAM get wired in without a new role — set
aws.irsa.extraPolicyArns to a list of ARNs (customer-managed or AWS-managed).
*/ -}}
{{- range $i, $arn := .Values.aws.irsa.extraPolicyArns }}
---
apiVersion: iam.aws.m.upbound.io/v1beta1
kind: RolePolicyAttachment
metadata:
  name: {{ include "centcom-satellite.fullname" $top }}-extra-{{ $i }}
  namespace: {{ $top.Release.Namespace }}
  labels:
    {{- include "centcom-satellite.labels" $top | nindent 4 }}
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: {{ $top.Values.aws.irsa.providerConfigRef }}
  forProvider:
    roleRef:
      name: {{ include "centcom-satellite.irsaRoleName" $top }}
    policyArn: {{ $arn | quote }}
{{- end }}
{{- end }}
