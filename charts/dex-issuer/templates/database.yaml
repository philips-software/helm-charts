apiVersion: dip.io/v1alpha1
kind: Postgres
metadata:
  # Overridable so an adopter with a pre-existing, non-chart-managed Postgres
  # claim can set this to that claim's exact name and have this resource
  # reconcile it in place instead of creating a second, colliding claim.
  name: {{ .Values.database.claimName | default "dex" }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "argocd.argoproj.io/sync-wave": "-1"
spec:
{{- if .Values.database.cnpg }}
  crossplane:
    compositionSelector:
      matchLabels:
        provider: cnpg
{{- end }}
  parameters:
    # resourcePrefix-ed by default: the identifier is account-global and must
    # not clash across clusters. Overridable to adopt an existing claim's
    # identifier verbatim -- changing an existing claim's identifier can make
    # the postgres-cnpg composition recreate the underlying CNPG Cluster.
    identifier: {{ .Values.database.identifier | default (printf "%s-dex" .Values.environmentConfig.resourcePrefix) }}
    size: {{ .Values.database.size }}
    allocatedStorage: {{ .Values.database.allocatedStorage }}
    engineVersion: {{ .Values.database.engineVersion | quote }}
    databaseName: dex
    masterUsername: dex
  {{- if and .Values.database.cnpg .Values.database.enableSnapshots }}
    enableSnapshots: true
    {{- if .Values.database.snapshotClassName }}
    snapshotClassName: {{ .Values.database.snapshotClassName }}
    {{- end }}
  {{- end }}
  {{- if .Values.database.storageClassName }}
    storageClassName: {{ .Values.database.storageClassName }}
  {{- end }}
  {{- if .Values.database.barmanBackup.enabled }}
    barmanBackup:
      enabled: true
      retentionDays: {{ .Values.database.barmanBackup.retentionDays }}
      {{- with .Values.database.barmanBackup.compression }}
      compression: {{ . }}
      {{- end }}
      {{- with .Values.database.barmanBackup.scheduleBaseBackup }}
      scheduleBaseBackup: {{ . | quote }}
      {{- end }}
      {{- with .Values.database.barmanBackup.bucketName }}
      bucketName: {{ . }}
      {{- end }}
      {{- with .Values.database.barmanBackup.bucketPrefix }}
      bucketPrefix: {{ . }}
      {{- end }}
      {{- with .Values.database.barmanBackup.endpointURL }}
      endpointURL: {{ . }}
      {{- end }}
      {{- with .Values.database.barmanBackup.serverName }}
      serverName: {{ . }}
      {{- end }}
      {{- if gt (int .Values.database.barmanBackup.maxParallel) 0 }}
      maxParallel: {{ .Values.database.barmanBackup.maxParallel }}
      {{- end }}
      {{- with .Values.database.barmanBackup.credentialsSecretRef.name }}
      # Static keys from a Secret created out of band. Its presence also
      # selects the static-key credential mode, which suppresses the AWS IAM
      # Role/Policy/RolePolicyAttachment and the IRSA service account
      # annotation - a cluster with no AWS provider cannot compose those.
      credentialsSecretRef:
        name: {{ . }}
        accessKeyIdKey: {{ $.Values.database.barmanBackup.credentialsSecretRef.accessKeyIdKey }}
        secretAccessKeyKey: {{ $.Values.database.barmanBackup.credentialsSecretRef.secretAccessKeyKey }}
      {{- end }}
  {{- end }}
  writeConnectionSecretToRef:
    name: {{ .Values.database.connectionSecretName | default "dex-postgres-connection" }}
