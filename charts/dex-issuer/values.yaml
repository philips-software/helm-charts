# dex-issuer Helm Chart Configuration
# Wrapper chart that deploys Dex (OIDC issuer) plus its Postgres storage, gRPC mTLS PKI,
# and the Crossplane provider-dex connector-management plane.
#
# This chart does NOT define a HelmApplication; it assumes it is itself provisioned by one.

# Dex application configuration
dex:
  # Number of Dex replicas (must be >= 1)
  replicas: 2
  # Log level for Dex (debug, info, warn, error)
  logLevel: info
  # Human-readable name shown on the Dex login screen (frontend.issuer)
  frontendIssuer: "DIP Services"
  # The OIDC issuer URL (config.issuer). Empty means "derive it from the
  # ingress host and the cluster FQDN", which is what the chart has always
  # done: https://<httpRoute.host>.<clusterFqdn>.
  #
  # Set it explicitly when the issuer URL and the ingress host are not the
  # same thing - an internal issuer reached through a route that is owned
  # elsewhere, or the other way round. The issuer URL is baked into every
  # OIDC client's configuration and into the "iss" claim of every token Dex
  # signs, so changing it invalidates existing tokens and breaks login for
  # every client on the cluster. It is also the value Dex puts in its
  # discovery document, and clients validate the two against each other.
  issuerURL: ""
  # Resource requests and limits for the Dex pod (memory-only limits, no CPU limit)
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 128Mi
  # Expose Dex via a Gateway API HTTPRoute (mutually exclusive with ingress)
  httpRoute:
    enabled: true
    # Host label for the issuer; combined with the cluster FQDN it forms the public
    # issuer endpoint, e.g. "issuer" -> https://issuer.${clusterFqdn}
    host: issuer
    sharedGatewayName: platform
    sharedGatewayNamespace: kube-system
  # Expose Dex via an Ingress (mutually exclusive with httpRoute)
  ingress:
    enabled: false
    host: issuer
    ingressClassName: nginx
  # Enable Dex ServiceMonitor scraping
  serviceMonitor:
    enabled: true
  # OAuth2 dynamic client registration (DCR). Kept enabled: this is how clients and
  # connectors are created at runtime (via Crossplane provider-dex over the gRPC API).
  dcr:
    enabled: true
  # Scope prefixes allowed for token introspection
  allowedScopePrefixes:
    - "hsp:iam:introspect"
  # Explicit list of OAuth2 grant types to advertise/accept. Empty (default)
  # means "whatever this Dex build's own unconfigured default is" - which is
  # NOT necessarily "all grants the binary supports": e.g. client_credentials
  # requires being listed here explicitly to become reachable, even though
  # the grant handler exists unconditionally in the binary. Set explicitly
  # any time a client needs a grant beyond the default set (confirmed live:
  # authorization_code, refresh_token, device_code, token-exchange).
  # Example: ["authorization_code", "refresh_token",
  #   "urn:ietf:params:oauth:grant-type:device_code",
  #   "urn:ietf:params:oauth:grant-type:token-exchange", "client_credentials"]
  grantTypes: []
  # OAuth2 token exchange (RFC 8693) token types Dex will mint/accept beyond
  # the default set. Rendered under config.oauth2.tokenExchange.tokenTypes
  # only when non-empty. Needed for EMA Role A (Dex mints ID-JAGs via Token
  # Exchange) -- e.g. ["urn:ietf:params:oauth:token-type:id_token",
  # "urn:ietf:params:oauth:token-type:id-jag"]. Also requires
  # "urn:ietf:params:oauth:grant-type:token-exchange" in grantTypes above.
  tokenExchange:
    tokenTypes: []
  # Enterprise Managed Authorization (EMA): lets Dex act as an MCP
  # Authorization Server, accepting ID-JAGs from a trusted issuer and
  # redeeming them for resource-bound access tokens (EMA Role B). Off by
  # default -- rendered under config.oauth2.enterpriseManagedAuthorization
  # only when enabled.
  enterpriseManagedAuthorization:
    enabled: false
    # Whether a token exchange may link accounts across issuers by email
    # claim alone. Leave false unless every trusted issuer is known to
    # verify email ownership.
    accountLinkingByEmail: false
    # Issuers this Dex accepts ID-JAGs from. Each entry needs issuer (the
    # "iss" claim to match), jwksURL (where to fetch verification keys), and
    # expectedAudience (the "aud" claim to match). Example: a Dex-to-Dex
    # self-test where this same Dex is both the minting (Role A) and
    # accepting (Role B) party:
    #   - issuer: https://issuer.example.com
    #     jwksURL: https://issuer.example.com/keys
    #     expectedAudience: https://issuer.example.com
    trustedIssuers: []
  # Authentication sessions (the "auth sessions" feature: server-side browser
  # sessions, prompt=none / prompt=login, max_age, id_token_hint, and an
  # RP-initiated /logout endpoint). Off by default; it needs a Dex build that
  # carries the feature (philips-forks/dex v2.45.1-dip.12 or newer).
  #
  # Enabling it renders both the DEX_SESSIONS_ENABLED feature flag on the Dex
  # pod and the matching "sessions:" block in config.yaml - Dex refuses to
  # start with one without the other.
  #
  # Sessions are stored server-side (the "postgres" storage this chart
  # provisions already carries the auth_session and user_identity tables) and
  # referenced by a cookie:
  #   - cookieName: name of the session cookie. The cookie is always
  #     HttpOnly and SameSite=Lax, and Secure when the issuer URL is https.
  #   - absoluteLifetime: hard upper bound on a session's life.
  #   - validIfNotUsedFor: idle timeout; a session unused for this long is
  #     gone, even if absoluteLifetime has not passed.
  #   - rememberMeCheckedByDefault: whether the "remember me" checkbox is
  #     pre-ticked. It only decides whether the cookie is a session cookie or
  #     a persistent one - a session is always created. It only shows up on
  #     the password connector's login form; for callback connectors (OIDC,
  #     SAML, ...) the default decides.
  #   - ssoSharedWithDefault: the SSO policy for clients that do not name
  #     their own. "none" (default) means a client's session is never reused
  #     by another client; "all" means any client may reuse any other
  #     client's session, which is realm-wide SSO.
  #     Prefer per-client policies (provider-dex's Client.ssoSharedWith):
  #     "all" also lets a session be reused for a client that is gated by
  #     allowedGroups, because a reused session does not re-check that.
  #   - cookieEncryptionKey: AES key (16, 24 or 32 bytes) used to encrypt the
  #     session cookie. Empty means the cookie is not encrypted. Dex expands
  #     "$VAR" references in its config, so this can point at an environment
  #     variable instead of a literal - do not put the key itself in a values
  #     file that lands in git.
  sessions:
    enabled: false
    cookieName: dex_session
    absoluteLifetime: "24h"
    validIfNotUsedFor: "1h"
    rememberMeCheckedByDefault: true
    ssoSharedWithDefault: "none"
    cookieEncryptionKey: ""
  # Token / signing key expiry
  expiry:
    signingKeys: "6h"
    idTokens: "8h"
  # Static OAuth clients. Empty by default (no RI clients). Each entry is passed
  # through verbatim to the upstream dex chart's config.staticClients list.
  # Example:
  #   - id: my-app
  #     name: 'My App'
  #     secretEnv: MY_APP_SECRET
  #     redirectURIs:
  #       - 'https://my-app.example.com/callback'
  staticClients: []
  # Secret (consumed via envFrom) that supplies the secretEnv values referenced by
  # staticClients and connectors. Enable only when staticClients need secrets.
  staticClientsSecret:
    enabled: false
    name: dex-static-clients
  # Container image for Dex
  image:
    repository: ghcr.io/philips-forks/dex
    # renovate: datasource=docker depName=ghcr.io/philips-forks/dex
    # v2.46.0-dip.3: enforces a client's allowedGroups on the session/SSO path.
    tag: "v2.46.0-dip.3"

# Upstream Dex Helm chart configuration
dexChart:
  repoURL: https://charts.dexidp.io
  # renovate: datasource=helm depName=dex registryUrl=https://charts.dexidp.io
  version: 0.26.0
  # Helm release name for Dex
  releaseName: dex

# ArgoCD configuration
argocd:
  # ArgoCD namespace (where Application CRs are created)
  namespace: argocd
  # ArgoCD project name for deployment (required, cannot be empty)
  project: default

# Database configuration (dip.io Postgres via Crossplane)
database:
  # Use the CNPG composition
  cnpg: true
  # Postgres storage/engine sizing
  size: xsmall
  allocatedStorage: 20
  # PostgreSQL engine version. Empty = not rendered, and the postgres-cnpg
  # composition applies its own default image (PostgreSQL 18.6, i.e. what CNPG
  # operator 1.30.1 ships). Set explicitly to hold a cluster on a version.
  engineVersion: ""
  # Enable CNPG snapshots + Barman backups
  enableSnapshots: true
  barmanBackup:
    enabled: true
    retentionDays: 7
    # Compression for the archived WAL segments and base backups. Empty =
    # not rendered, and the postgres-cnpg composition applies its own default
    # (gzip).
    compression: ""
    # Cron schedule for the base backup. Empty = not rendered (the composition
    # defaults to "0 0 0 * * *", daily at midnight).
    scheduleBaseBackup: ""
    # S3 bucket holding the archive. Empty = not rendered; the composition
    # derives "<environmentConfig.resourcePrefix>-barman".
    bucketName: ""
    # Prefix within the bucket. Empty = not rendered; the composition derives
    # "<namespace>/<identifier>".
    bucketPrefix: ""
    # S3-compatible endpoint (RustFS, MinIO, Garage, ...). Empty = not
    # rendered, which means AWS S3. A plain-http endpoint needs no CA bundle;
    # a self-signed HTTPS one additionally needs the composition's
    # endpointCA.
    endpointURL: ""
    # Barman server name for ongoing WAL archiving. Empty = not rendered; the
    # composition derives "<identifier>-wal". It must differ from the server
    # name a restore reads from, otherwise CNPG refuses to recover ("Expected
    # empty archive").
    serverName: ""
    # Parallel WAL upload jobs per instance. 0 = not rendered; the composition
    # defaults to 4. Lower it on small hosts - each job is another concurrent
    # upload against the object store.
    maxParallel: 0
    # Static S3 credentials, by reference to a Secret that is created OUT OF
    # BAND (this chart never creates or reads it). Setting the name selects
    # the static-key credential mode, which suppresses the AWS IAM
    # Role/Policy/RolePolicyAttachment and the IRSA service account
    # annotation the postgres-cnpg composition would otherwise render - a
    # cluster with no AWS provider cannot compose those at all, so the whole
    # composition fails.
    credentialsSecretRef:
      # Name of the Secret in the claim's namespace. Empty = not rendered,
      # which leaves the AWS IRSA credential mode in place.
      name: ""
      # Keys inside that Secret.
      accessKeyIdKey: ACCESS_KEY_ID
      secretAccessKeyKey: ACCESS_SECRET_KEY
  # Name of the Postgres claim (metadata.name). Defaults to "dex". Override
  # to adopt a pre-existing, non-chart-managed Postgres claim in place
  # instead of creating a second one that collides on connectionSecretName.
  claimName: ""
  # Postgres claim identifier (spec.parameters.identifier). Defaults to
  # "<environmentConfig.resourcePrefix>-dex". Override to match an existing
  # claim's identifier verbatim when adopting it via claimName above --
  # changing an existing claim's identifier can make the postgres-cnpg
  # composition recreate the underlying CNPG Cluster.
  identifier: ""
  # Name of the Secret the Postgres claim writes its connection details to,
  # and that Dex reads DEX_PG_* from. Defaults to "dex-postgres-connection".
  connectionSecretName: ""
  # VolumeSnapshotClass used for CNPG's backup.volumeSnapshot.className
  # (only rendered when enableSnapshots is true). The postgres-cnpg
  # composition defaults this to the literal name "default" when unset --
  # correct on clusters whose VolumeSnapshotClass is actually named
  # "default" (e.g. the rpi homelab's nfs.csi.k8s.io class), but wrong
  # anywhere else (e.g. dip-ce-k3s-eu's EBS CSI class is named
  # "ebs-csi-aws") -- a mismatch fails every scheduled backup with
  # "volumesnapshotclass.snapshot.storage.k8s.io \"default\" not found".
  # Leave empty to keep the composition's default; override to match
  # `kubectl get volumesnapshotclass` on the target cluster.
  snapshotClassName: ""
  # StorageClass for the underlying PVCs. Leave empty to use the cluster's
  # default StorageClass.
  storageClassName: ""

# Crossplane connector-management plane (provider-dex).
# When enabled, deploys the self-signed PKI, the Dex gRPC server certificate,
# the provider-dex Crossplane provider, and its ProviderConfigs.
provider:
  enabled: true
  # Enable debug logging for provider-dex
  debug: true
  # Provider package version
  # renovate: datasource=docker depName=xpkg.upbound.io/loafoe/provider-dex
  tag: "v1.15.0"
  # Container registry hosting the provider-dex package
  registry: "xpkg.upbound.io/loafoe"
  # crossplane-providers wrapper chart version
  # renovate: datasource=docker depName=ghcr.io/philips-software/helm-charts/crossplane-providers
  crossplaneProvidersVersion: 0.0.40
  # Controls the ArgoCD cascade-delete finalizer on the provider-dex Application.
  # When false (default), deleting the Application is NON-CASCADING: it orphans the
  # live Crossplane Provider/CRDs/CRs instead of tearing them down. This is the safe
  # default -- cascade-deleting a provider whose controller pod is gone deadlocks the
  # stack on unprocessable managed-resource finalizers.
  cascadeDelete: false
  # Namespaces to create namespaced ProviderConfigs in (in addition to the
  # cluster-default ProviderConfig). Empty by default: add a namespace here when
  # you place Client CRs in it (they resolve providerConfigRef against a
  # ProviderConfig in their own namespace).
  providerConfigNamespaces: []

# PKI for Crossplane <-> Dex gRPC mTLS. This chart never creates its own
# cluster-scoped ClusterIssuer -- that is a shared, cluster-wide resource, and
# a second Application creating one under the same name causes ArgoCD
# SharedResourceWarnings and ownership fights (see e.g.
# https://github.com/philips-software/helm-charts/issues -- crossplane-selfsigned-issuer
# collision with the k8s-aws-bootstrap chart's own Crossplane PKI).
pki:
  # Name of an existing cluster-scoped ClusterIssuer to root the mTLS CA chain
  # in. Required to enable mTLS: leave empty to disable the gRPC mTLS PKI
  # entirely (dex-grpc-tls, provider-dex-client-tls, and the intermediate CA
  # are then not created, and provider-dex talks to Dex over plaintext gRPC).
  existingClusterIssuer: ""
  # Force the Dex pod to render its gRPC mTLS config (volume mount +
  # config.yaml's grpc.tls* fields) even when this chart isn't the one
  # managing the PKI chain or provider-dex (provider.enabled: false) -- e.g.
  # a cluster where provider-dex and its CA are installed through a separate,
  # pre-existing kustomize/Application path. The dex-grpc-tls Secret must
  # then already exist in this release's namespace out of band; this chart
  # will not create it.
  grpcMtlsEnabled: false
  # Namespace where the CA certificate secret is created (cert-manager reads it here)
  caNamespace: cert-manager
  # Namespace where the provider-dex client certificate is created
  clientNamespace: crossplane-system
  # CA certificate validity
  caDuration: 87600h  # 10 years
  caRenewBefore: 8760h  # 1 year
  # Leaf (client / server) certificate validity
  certDuration: 8760h  # 1 year
  certRenewBefore: 720h  # 30 days

# Philips-branded Dex login theme. When enabled, the theme is mounted into Dex as a
# ConfigMap. RI-specific connector hide-rules have been stripped from styles.css.
theme:
  enabled: true
  # Name of an existing ConfigMap (keys: styles.css, philips-logo.svg,
  # logo.png) to mount into Dex instead of this chart's bundled theme. When
  # set, this chart does not create its own dex-theme ConfigMap - manage it
  # yourself (e.g. a kustomize configMapGenerator) so custom branding doesn't
  # require forking this chart. Leave empty to use the bundled theme.
  existingConfigMap: ""

# Use custom FQDN instead of clusterFqdn (falls back to clusterFqdn if customFqdn is empty)
useCustomFqdn: false

# Environment configuration (injected per-cluster, typically via EnvironmentConfig)
environmentConfig:
  # Fully qualified domain name for the cluster (required, must be valid domain format)
  clusterFqdn: ""
  # Custom FQDN for the issuer (used when useCustomFqdn is true)
  customFqdn: ""
  # Resource prefix for the cluster; used to namespace account-global resource names
  # such as the Postgres identifier (alphanumeric characters and hyphens only)
  resourcePrefix: ""
  # Ownership metadata propagated onto managed workloads so they satisfy the
  # require-owner-label Kyverno policy. Empty owner omits the label;
  # empty managedBy keeps the chart's default app.kubernetes.io/managed-by value.
  owner: ""
  managedBy: ""
