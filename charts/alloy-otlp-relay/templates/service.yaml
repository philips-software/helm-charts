apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "alloy-otlp-relay.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: otlp-http
      port: {{ .Values.receiver.http.port }}
      targetPort: otlp-http
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
