# agentgateway-bootstrap configuration

# Deployment mode: "kubernetes" (default) or "standalone"
mode: kubernetes

# Upstream agentgateway-crds Helm chart configuration
agentgatewayCrdsChart:
  # Repository URL for agentgateway-crds chart
  repoURL: oci://cr.agentgateway.dev/charts
  # Version for agentgateway-crds chart
  # renovate: datasource=docker depName=cr.agentgateway.dev/charts/agentgateway-crds
  version: 1.5.0

# Upstream agentgateway Helm chart configuration
agentgatewayChart:
  # Repository URL for agentgateway chart
  repoURL: oci://cr.agentgateway.dev/charts
  # Version for agentgateway chart
  # renovate: datasource=docker depName=cr.agentgateway.dev/charts/agentgateway
  version: 1.5.0

# Upstream agentgateway-standalone Helm chart configuration
agentgatewayStandaloneChart:
  # Repository URL for agentgateway-standalone chart
  repoURL: oci://cr.agentgateway.dev/charts
  # Version for agentgateway-standalone chart
  # renovate: datasource=docker depName=cr.agentgateway.dev/charts/agentgateway-standalone
  version: 1.5.0

# Standalone mode specific configuration
standalone:
  # Replica count for standalone deployment
  replicaCount: 1
  service:
    # Service type for standalone deployment
    type: ClusterIP
  # Override the agentgateway-standalone image (e.g. to run a locally-patched
  # build). Leave repository unset to use the upstream agentgateway-standalone
  # chart's own default (cr.agentgateway.dev/agentgateway, tagged at the
  # chart's appVersion).
  image:
    registry: ""
    repository: ""
    tag: ""

# ArgoCD project name
argoProject: default

# Environment configuration for variable substitution
environmentConfig:
  resourcePrefix: ""
  region: ""
  accountId: ""

# Amazon Bedrock LLM Provider configuration
bedrock:
  # Enable Amazon Bedrock backend and route configuration
  enabled: true
  # AWS Region for Amazon Bedrock (supports ${region} variable substitution)
  region: us-east-1
  # Default Bedrock model (e.g. amazon.nova-micro-v1:0, us.anthropic.claude-3-5-sonnet-20241022-v2:0)
  model: amazon.nova-micro-v1:0
  # Authentication configuration
  auth:
    # Auth type: "irsa" (default - IAM Roles for Service Accounts via the
    # cluster's pod-identity webhook and an externally-provisioned IAM role;
    # see roleArn below) or "secret" (static AWS credentials from a Kubernetes
    # Secret).
    type: irsa
    # IAM role ARN to annotate the dataplane ServiceAccount with when
    # auth.type is "irsa" (eks.amazonaws.com/role-arn). The cluster's
    # pod-identity webhook then injects AWS_ROLE_ARN/AWS_WEB_IDENTITY_TOKEN_FILE
    # into the dataplane pod, which performs sts:AssumeRoleWithWebIdentity
    # against this role automatically - no further chart-side wiring needed.
    # This role must already exist (trust policy + Bedrock permissions
    # provisioned externally) - this chart does not create it. Required
    # when auth.type is "irsa".
    roleArn: ""
    # Secret name containing AWS credentials if auth.type is "secret"
    secretName: bedrock-secret
  # Route configuration for Bedrock
  route:
    enabled: true
    path: /bedrock
    openAiPath: /v1/chat/completions

# OpenRouter LLM Provider configuration (standalone mode only - the
# kubernetes-mode Gateway/AgentgatewayBackend path never wired OpenRouter).
# Independent of bedrock.enabled: both can be on at once in standalone mode.
openrouter:
  # Enable an OpenRouter provider + deepseek/deepseek-v4-flash model in the
  # standalone chart's static config. The API key is read at deploy time from
  # the agentgateway-openrouter-secret Secret (see agentgateway-standalone-helm.yaml).
  enabled: true

# Postgres database for LLM cost tracking (agentgateway's request-logging DB, which
# powers its cost dashboard and Analytics UI). Provisions a plain CNPG Cluster
# directly - no Crossplane, no external-secrets dependency. CNPG generates its own
# <clusterName>-app Secret (with a combined `uri` key) since bootstrap.initdb.secret
# is left unset; a Job (separate from this values block) reads that key and wires it
# into AgentgatewayParameters.spec.rawConfig.database.url.
database:
  # Provision a CNPG Cluster for agentgateway's request-logging database.
  enabled: true
  # Cluster resource name. Defaults to "<gateway.name>-db" if unset.
  clusterName: ""
  # Number of CNPG instances (1 = no HA, single replica; 2+ = HA with automatic
  # failover). Matches the DIP Postgres composition's default of 2.
  instances: 2
  # Database (and owner role) name.
  databaseName: agentgateway
  # Database owner password.
  password: "agentgateway123"
  storage:
    size: 5Gi
    # Leave empty to use the cluster's default StorageClass.
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  backup:
    # CNPG VolumeSnapshot backups (CSI snapshots of the PGDATA PVC), no
    # Crossplane/S3/Barman dependency - consistent with this chart's
    # plain-CNPG design. Off by default because className is cluster-specific.
    volumeSnapshot:
      enabled: false
      # VolumeSnapshotClass to use (must support the cluster's StorageClass CSI driver).
      className: ""
      # Hot (online) backup via pg_backup_start/stop; false pauses WAL first for a cold snapshot.
      online: true
      # Cron schedule for a ScheduledBackup (method: volumeSnapshot). Leave empty to
      # disable scheduling - on-demand backups can still be triggered with a Backup CR.
      schedule: ""

# Kubernetes Gateway resource configuration
gateway:
  enabled: true
  # Must differ from the Helm release name used for the upstream agentgateway
  # controller install (see agentgateway-helm.yaml's releaseName: agentgateway) -
  # the controller dynamically provisions a per-Gateway dataplane Deployment
  # named after this Gateway object, which collides with the controller's own
  # Helm-managed Deployment if the names match.
  name: agentgateway-gw
  className: agentgateway
  namespace: agentgateway-system
  # Service type for the dynamically-provisioned per-Gateway dataplane Service.
  # The embedded agentgateway-standalone chart defaults this to LoadBalancer;
  # override to ClusterIP unless external exposure is explicitly wanted.
  service:
    type: ClusterIP

# JWT authentication for the Gateway. Disabled by default - opt in once
# clients are ready to send tokens from the configured issuer. When enabled,
# validation is Strict: every request must carry a valid JWT.
jwt:
  enabled: false
  # IdP that issued the JWT (must match the token's `iss` claim exactly).
  issuer: ""
  # Allowed `aud` claim values. Required when jwt.enabled is true - an
  # unset list accepts any validly-signed token from the issuer regardless
  # of which service it was minted for, which matters whenever the issuer
  # is shared across multiple services (as most OIDC providers are).
  audiences: []
  # External issuer reached over TLS (e.g. an OIDC provider outside the
  # cluster). host/port target the issuer's JWKS endpoint; jwksPath is the
  # path component of its jwks_uri (see the issuer's
  # /.well-known/openid-configuration document).
  externalIssuer:
    host: ""
    port: 443
    jwksPath: /keys
    # SNI to present in the TLS handshake. Defaults to externalIssuer.host
    # when unset.
    sni: ""
  cacheDuration: 5m

# Admin UI internal service configuration
ui:
  # Enable internal ClusterIP Service for the read-only Admin UI (port 15000)
  enabled: true
  service:
    type: ClusterIP
    port: 15000
    targetPort: 15000
  # Browser-based OIDC login for the Admin UI (standalone mode only). Protects
  # UI traffic once it's attached to an externally-reachable gateway/HTTPRoute -
  # enable this before exposing the UI beyond the cluster-internal admin port.
  # The client secret is read at deploy time from the agentgateway-oidc-secret
  # Secret (key clientSecret; see agentgateway-standalone-helm.yaml), and the
  # browser session cookie is signed with OIDC_COOKIE_SECRET from the
  # <release>-oidc Secret the upstream chart already wires in unconditionally.
  oidc:
    enabled: false
    # OIDC issuer URL (used for discovery + ID token validation).
    issuer: ""
    # OAuth2 client ID registered with the issuer.
    clientId: ""
    # Absolute callback URI the gateway handles for the OIDC code exchange
    # (e.g. https://<ui-hostname>/oauth/callback). Must match a redirect URI
    # registered with the issuer.
    redirectURI: ""
    # Additional OAuth2 scopes to request. `openid` is always included.
    scopes: []
  # Restrict Admin UI access to specific JWT groups claim values, on top of
  # oidc above (oidc.enabled must be true for this to have any effect - it
  # renders a ui.policies.authorization CEL rule requiring at least one of
  # these strings to appear in the `groups` claim, e.g. Dex group slugs like
  # "philips-internal:some-group" or "urn:iamr:<org>:<group>"). Leave empty
  # to allow any authenticated user through OIDC with no group restriction.
  authorization:
    groups: []

# Standalone-mode direct OTLP trace export: agentgateway's own process exports
# spans straight to an OTLP HTTP receiver (e.g. Langfuse's /api/public/otel).
# Separate from `tracing.*` below, which only applies to `mode: kubernetes`
# (an AgentgatewayPolicy pointing at a Gateway API backendRef) and is dead
# code in standalone mode.
standaloneTracing:
  enabled: false
  # OTLP HTTP receiver origin ONLY (scheme+host, e.g. https://langfuse.example.com)
  # - NOT the full ingestion path. agentgateway's `path` below is joined as an
  # absolute path and REPLACES otlpEndpoint's own path component entirely
  # (confirmed empirically: otlpEndpoint with a path + a `path` value produces
  # scheme+host+path, dropping otlpEndpoint's path) - so put the full ingestion
  # path (e.g. Langfuse's /api/public/otel/v1/traces) in `path`, not here.
  otlpEndpoint: ""
  # grpc or http - Langfuse's OTLP receiver requires http.
  otlpProtocol: http
  # Full absolute ingestion path - see otlpEndpoint note above. Langfuse:
  # /api/public/otel/v1/traces.
  path: /v1/traces
  # true (or a 0.0-1.0 ratio) to sample all traces.
  randomSampling: true
  # Static, non-secret headers sent with every OTLP export (e.g. vendor
  # ingestion-version headers). Values are compiled as CEL expressions (same
  # engine as frontendPolicies.accessLog), so a literal string MUST be a CEL
  # string literal - wrap it in embedded double quotes, e.g. '"4"', not just "4".
  headers: {}
  # Secret holding the sensitive Authorization header value's bearer token
  # (just the base64 "publicKey:secretKey" part, no "Basic " prefix - the
  # rendered config template adds that), injected as env var OTLP_AUTH_HEADER
  # and referenced via ${OTLP_AUTH_HEADER} in the rendered config. Leave name
  # empty if the OTLP receiver needs no auth.
  authHeaderSecret:
    name: ""
    key: "OTLP_AUTH_HEADER"

# OpenTelemetry Tracing configuration
tracing:
  # Enable OpenTelemetry tracing AgentgatewayPolicy
  enabled: false
  # OTel Collector backend reference
  backendRef:
    name: otlp-gateway
    namespace: otlp-gateway
    port: 4317
  # Tracing protocol: GRPC or HTTP
  protocol: GRPC
  # Random sampling ratio ("1.0" for 100%, "0.1" for 10%)
  randomSampling: "1.0"
  clientSampling: "true"
  resources:
    - name: deployment.environment.name
      expression: '"production"'
  attributes:
    add:
      - name: host
        expression: 'request.host'

# Upstream agentgateway controller options
controller:
  replicaCount: 1
  logLevel: info
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

# Monitoring & Prometheus metrics scraping configuration
monitoring:
  # Enable Prometheus ServiceMonitor and Grafana dashboard creation
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s
  grafanaDashboard:
    enabled: true

# Data plane proxy defaults
proxy:
  logLevel: info
