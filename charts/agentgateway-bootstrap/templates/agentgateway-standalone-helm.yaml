{{- if eq .Values.mode "standalone" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentgateway-standalone
  namespace: {{ .Values.argoNamespace | default "argocd" }}
  labels:
    {{- include "agentgateway-bootstrap.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: {{ .Values.argoProject }}
  source:
    repoURL: {{ printf "%s/agentgateway-standalone" .Values.agentgatewayStandaloneChart.repoURL | quote }}
    targetRevision: {{ .Values.agentgatewayStandaloneChart.version | quote }}
    path: .
    helm:
      releaseName: agentgateway-standalone
      valuesObject:
        mode: database
        config:
          adminAddr: "[::]:15000"
          database:
            url: {{ printf "postgresql://%s:${DB_PASSWORD}@%s-rw:5432/%s" (.Values.database.databaseName | default "agentgateway") (include "agentgateway-bootstrap.postgresClusterName" .) (.Values.database.databaseName | default "agentgateway") | quote }}
          llm:
            policies:
              apiKey: {}
            providers:
              - name: openrouter
                provider: openrouter
                params:
                  baseUrl: https://openrouter.ai/api/v1
                  apiKey: ${OPENROUTER_API_KEY}
            models:
              - name: deepseek/deepseek-v4-flash
                provider: openrouter
        database:
          postgres:
            url: {{ printf "postgresql://%s:${DB_PASSWORD}@%s-rw:5432/%s" (.Values.database.databaseName | default "agentgateway") (include "agentgateway-bootstrap.postgresClusterName" .) (.Values.database.databaseName | default "agentgateway") | quote }}
        replicaCount: {{ .Values.standalone.replicaCount | default 1 }}
        extraEnv:
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ printf "%s-credentials" (include "agentgateway-bootstrap.postgresClusterName" .) | quote }}
                key: password
          - name: OPENROUTER_API_KEY
            valueFrom:
              secretKeyRef:
                name: agentgateway-openrouter-secret
                key: apiKey
                optional: true
        gateway:
          service:
            type: {{ .Values.standalone.service.type | default "ClusterIP" }}
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: agentgateway-standalone-config
      jsonPointers:
        - /data/config.yaml
      jqPathExpressions:
        - .data["config.yaml"]
  destination:
    server: "https://kubernetes.default.svc"
    namespace: {{ .Values.gateway.namespace | default "agentgateway-system" }}
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
{{- end }}
