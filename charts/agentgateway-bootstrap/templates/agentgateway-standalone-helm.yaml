{{- if eq .Values.mode "standalone" }}
{{- include "agentgateway-bootstrap.validateConfig" . -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentgateway-standalone
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentgateway-bootstrap.labels" . | nindent 4 }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: {{ .Values.argoProject }}
  source:
    repoURL: {{ printf "%s/agentgateway-standalone" .Values.agentgatewayStandaloneChart.repoURL | quote }}
    targetRevision: {{ .Values.agentgatewayStandaloneChart.version | quote }}
    path: .
    helm:
      releaseName: agentgateway-standalone
      valuesObject:
        mode: database
        database:
          postgres:
            url: {{ printf "postgresql://%s:placeholder@%s-rw:5432/%s" (.Values.database.databaseName | default "agentgateway") (include "agentgateway-bootstrap.postgresClusterName" .) (.Values.database.databaseName | default "agentgateway") | quote }}
        replicaCount: {{ .Values.standalone.replicaCount | default 1 }}
        extraEnv:
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: {{ printf "%s-app" (include "agentgateway-bootstrap.postgresClusterName" .) | quote }}
                key: uri
          - name: AGENTGATEWAY_DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: {{ printf "%s-app" (include "agentgateway-bootstrap.postgresClusterName" .) | quote }}
                key: uri
        gateway:
          service:
            type: {{ .Values.standalone.service.type | default "ClusterIP" }}
  destination:
    server: "https://kubernetes.default.svc"
    namespace: {{ .Values.gateway.namespace | default "agentgateway-system" }}
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
{{- end }}
