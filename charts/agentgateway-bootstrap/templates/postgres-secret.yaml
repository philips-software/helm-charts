{{- if .Values.database.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentgateway-bootstrap.postgresClusterName" . }}-credentials
  namespace: {{ .Values.gateway.namespace | default "agentgateway-system" }}
  labels:
    {{- include "agentgateway-bootstrap.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.database.databaseName | default "agentgateway" | quote }}
  password: {{ .Values.database.password | default "agentgateway123" | quote }}
{{- end }}
