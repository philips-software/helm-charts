{{- /*
Pre-install / pre-upgrade init Job that owns the CNPG database credentials
Secret (`<clusterName>-credentials`), so no database password lives in values.

Design (mirrors grafana's admin-initializer / langfuse-bootstrap's
credentials-init):
  * Generate a random password ONLY when the Secret's `password` key is absent;
    preserve any existing value byte-for-byte. Re-syncs are therefore
    idempotent - rotating the CNPG owner password would break the dataplane's
    DB_PASSWORD plumbing and (in kubernetes mode) the DB URL wired into
    AgentgatewayParameters.
  * Generated in-cluster with kubectl, NOT at Helm template time, so the
    "ArgoCD renders via helm template and can't use lookup" problem disappears.

The Secret is consumed by:
  * the CNPG Cluster's `bootstrap.initdb.secret` (owner role at first init), and
  * the standalone dataplane's DB_PASSWORD env (agentgateway-standalone-helm.yaml).

The Job runs as a Helm pre-install/pre-upgrade hook AND an ArgoCD PreSync hook so
it works under both plain `helm upgrade` and ArgoCD (this chart is normally
deployed as an ArgoCD Application). PreSync guarantees the Secret exists before
the CNPG Cluster (sync-wave 1) is applied.
*/ -}}
{{- if .Values.database.enabled -}}
{{- $ns := .Values.gateway.namespace | default "agentgateway-system" -}}
{{- $secret := printf "%s-credentials" (include "agentgateway-bootstrap.postgresClusterName" .) -}}
{{- $user := .Values.database.databaseName | default "agentgateway" -}}
{{- $hookMeta := dict
      "helm.sh/hook" "pre-install,pre-upgrade"
      "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded"
      "argocd.argoproj.io/hook" "PreSync"
      "argocd.argoproj.io/hook-delete-policy" "BeforeHookCreation" -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentgateway-bootstrap.fullname" . }}-postgres-credentials-init
  namespace: {{ $ns }}
  labels:
    {{- include "agentgateway-bootstrap.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-20") $hookMeta) | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agentgateway-bootstrap.fullname" . }}-postgres-credentials-init
  namespace: {{ $ns }}
  labels:
    {{- include "agentgateway-bootstrap.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-20") $hookMeta) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agentgateway-bootstrap.fullname" . }}-postgres-credentials-init
  namespace: {{ $ns }}
  labels:
    {{- include "agentgateway-bootstrap.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-20") $hookMeta) | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "agentgateway-bootstrap.fullname" . }}-postgres-credentials-init
    namespace: {{ $ns }}
roleRef:
  kind: Role
  name: {{ include "agentgateway-bootstrap.fullname" . }}-postgres-credentials-init
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agentgateway-bootstrap.fullname" . }}-postgres-credentials-init
  namespace: {{ $ns }}
  labels:
    {{- include "agentgateway-bootstrap.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-10") $hookMeta) | nindent 4 }}
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        {{- include "agentgateway-bootstrap.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres-credentials-init
    spec:
      serviceAccountName: {{ include "agentgateway-bootstrap.fullname" . }}-postgres-credentials-init
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init
          # renovate: datasource=docker depName=alpine/k8s
          image: alpine/k8s:1.37.1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: NAMESPACE
              value: {{ $ns | quote }}
            - name: SECRET
              value: {{ $secret | quote }}
            - name: DB_USER
              value: {{ $user | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              log() { echo "[postgres-credentials-init] $*"; }

              # Alphanumeric only: this lands in the dataplane's DB URL.
              rand_alnum() {
                need="$1"; out=""
                while [ "${#out}" -lt "$need" ]; do
                  out="${out}$(LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom | head -c $((need - ${#out})) || true)"
                done
                printf '%s' "$out"
              }

              existing="$(kubectl get secret "$SECRET" -n "$NAMESPACE" -o jsonpath='{.data.password}' 2>/dev/null | base64 -d 2>/dev/null || true)"
              if [ -n "$existing" ]; then
                log "$SECRET/password present - preserving"
                exit 0
              fi

              PW="$(rand_alnum 32)"
              log "$SECRET/password absent - generating"
              if kubectl get secret "$SECRET" -n "$NAMESPACE" >/dev/null 2>&1; then
                kubectl patch secret "$SECRET" -n "$NAMESPACE" --type merge \
                  -p "$(printf '{"stringData":{"username":"%s","password":"%s"}}' "$DB_USER" "$PW")"
              else
                kubectl create secret generic "$SECRET" -n "$NAMESPACE" \
                  --type=kubernetes.io/basic-auth \
                  --from-literal=username="$DB_USER" \
                  --from-literal=password="$PW" \
                  --dry-run=client -o yaml | kubectl apply -f -
              fi

              log "done"
{{- end -}}
