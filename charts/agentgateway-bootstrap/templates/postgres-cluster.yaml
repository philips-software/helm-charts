{{- if .Values.database.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "agentgateway-bootstrap.postgresClusterName" . }}
  namespace: {{ .Values.gateway.namespace | default "agentgateway-system" }}
  labels:
    {{- include "agentgateway-bootstrap.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  instances: {{ .Values.database.instances }}
  {{- if .Values.database.backup.volumeSnapshot.enabled }}
  backup:
    volumeSnapshot:
      className: {{ .Values.database.backup.volumeSnapshot.className | required "database.backup.volumeSnapshot.className is required when database.backup.volumeSnapshot.enabled is true" | quote }}
      online: {{ .Values.database.backup.volumeSnapshot.online }}
  {{- end }}
  bootstrap:
    initdb:
      database: {{ .Values.database.databaseName | quote }}
      owner: {{ .Values.database.databaseName | quote }}
  # No bootstrap.initdb.secret: CNPG generates and owns the application user's
  # password and publishes it in the <cluster>-app Secret (keys incl. `uri`,
  # `username`, `password`). All consumers read that Secret. Setting
  # bootstrap.initdb.secret here would diverge from <cluster>-app (a known
  # footgun), so it is deliberately omitted.
  storage:
    size: {{ .Values.database.storage.size | quote }}
    {{- if .Values.database.storage.storageClass }}
    storageClass: {{ .Values.database.storage.storageClass | quote }}
    {{- end }}
  resources:
    requests:
      cpu: {{ .Values.database.resources.requests.cpu | quote }}
      memory: {{ .Values.database.resources.requests.memory | quote }}
    limits:
      memory: {{ .Values.database.resources.limits.memory | quote }}
{{- end }}
