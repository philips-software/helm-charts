{{- if and .Values.database.enabled (eq .Values.mode "kubernetes") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentgateway-bootstrap.fullname" . }}-postgres-wire
  namespace: {{ .Values.gateway.namespace | default "agentgateway-system" }}
  labels:
    {{- include "agentgateway-bootstrap.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agentgateway-bootstrap.fullname" . }}-postgres-wire
  namespace: {{ .Values.gateway.namespace | default "agentgateway-system" }}
  labels:
    {{- include "agentgateway-bootstrap.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "watch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "watch"]
  - apiGroups: ["agentgateway.dev"]
    resources: ["agentgatewayparameters"]
    # get is required too: `kubectl patch` fetches the current object before
    # sending the merge patch. Confirmed live: patch-only RBAC is rejected
    # with "cannot get resource agentgatewayparameters" on a real cluster.
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agentgateway-bootstrap.fullname" . }}-postgres-wire
  namespace: {{ .Values.gateway.namespace | default "agentgateway-system" }}
  labels:
    {{- include "agentgateway-bootstrap.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "2"
subjects:
  - kind: ServiceAccount
    name: {{ include "agentgateway-bootstrap.fullname" . }}-postgres-wire
    namespace: {{ .Values.gateway.namespace | default "agentgateway-system" }}
roleRef:
  kind: Role
  name: {{ include "agentgateway-bootstrap.fullname" . }}-postgres-wire
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agentgateway-bootstrap.fullname" . }}-postgres-wire
  namespace: {{ .Values.gateway.namespace | default "agentgateway-system" }}
  labels:
    {{- include "agentgateway-bootstrap.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 4
  template:
    metadata: {}
    spec:
      serviceAccountName: {{ include "agentgateway-bootstrap.fullname" . }}-postgres-wire
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wire-database-url
          # renovate: datasource=docker depName=alpine/k8s
          image: alpine/k8s:1.37.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          env:
            - name: NAMESPACE
              value: {{ .Values.gateway.namespace | default "agentgateway-system" | quote }}
            - name: CLUSTER_NAME
              value: {{ include "agentgateway-bootstrap.postgresClusterName" . | quote }}
            - name: PARAMS_NAME
              value: {{ printf "%s-params" .Values.gateway.name | quote }}
            - name: CRED_SECRET
              value: {{ printf "%s-credentials" (include "agentgateway-bootstrap.postgresClusterName" .) | quote }}
            - name: DB_NAME
              value: {{ .Values.database.databaseName | default "agentgateway" | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eo pipefail
              echo "Waiting for CNPG cluster $CLUSTER_NAME to be ready..."
              kubectl wait --for=condition=Ready cluster.postgresql.cnpg.io/"$CLUSTER_NAME" \
                -n "$NAMESPACE" --timeout=300s

              # Build the URL from the OWNER credentials (the Secret the
              # postgres-credentials-init Job owns and CNPG's
              # bootstrap.initdb.secret consumes). Deliberately NOT from CNPG's
              # <cluster>-app Secret: its `uri`/`password` can diverge from the
              # actual role password (observed stale on a live cluster) and would
              # wire a broken DB connection into the dataplane.
              echo "Reading owner credentials from $CRED_SECRET..."
              DB_USER=$(kubectl get secret "$CRED_SECRET" -n "$NAMESPACE" -o jsonpath='{.data.username}' | base64 -d)
              DB_PASS=$(kubectl get secret "$CRED_SECRET" -n "$NAMESPACE" -o jsonpath='{.data.password}' | base64 -d)
              if [ -z "$DB_USER" ] || [ -z "$DB_PASS" ]; then
                echo "ERROR: username/password missing in $CRED_SECRET" >&2
                exit 1
              fi
              DATABASE_URL="postgresql://${DB_USER}:${DB_PASS}@${CLUSTER_NAME}-rw.${NAMESPACE}.svc.cluster.local:5432/${DB_NAME}"

              echo "Patching AgentgatewayParameters/$PARAMS_NAME with config.database.url..."
              PATCH=$(jq -n --arg url "$DATABASE_URL" '{spec:{rawConfig:{config:{database:{url:$url}},database:null}}}')
              kubectl patch agentgatewayparameters "$PARAMS_NAME" -n "$NAMESPACE" \
                --type merge -p "$PATCH"

              echo "Done."
{{- end }}
