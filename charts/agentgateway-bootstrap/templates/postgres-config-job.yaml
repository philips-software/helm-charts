{{- if .Values.database.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentgateway-bootstrap.fullname" . }}-postgres-wire
  namespace: {{ .Values.gateway.namespace | default "agentgateway-system" }}
  labels:
    {{- include "agentgateway-bootstrap.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agentgateway-bootstrap.fullname" . }}-postgres-wire
  namespace: {{ .Values.gateway.namespace | default "agentgateway-system" }}
  labels:
    {{- include "agentgateway-bootstrap.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "watch", "patch", "update"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "watch"]
  - apiGroups: ["agentgateway.dev"]
    resources: ["agentgatewayparameters"]
    # get is required too: `kubectl patch` fetches the current object before
    # sending the merge patch. Confirmed live: patch-only RBAC is rejected
    # with "cannot get resource agentgatewayparameters" on a real cluster.
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agentgateway-bootstrap.fullname" . }}-postgres-wire
  namespace: {{ .Values.gateway.namespace | default "agentgateway-system" }}
  labels:
    {{- include "agentgateway-bootstrap.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "2"
subjects:
  - kind: ServiceAccount
    name: {{ include "agentgateway-bootstrap.fullname" . }}-postgres-wire
    namespace: {{ .Values.gateway.namespace | default "agentgateway-system" }}
roleRef:
  kind: Role
  name: {{ include "agentgateway-bootstrap.fullname" . }}-postgres-wire
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agentgateway-bootstrap.fullname" . }}-postgres-wire
  namespace: {{ .Values.gateway.namespace | default "agentgateway-system" }}
  labels:
    {{- include "agentgateway-bootstrap.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 4
  template:
    metadata: {}
    spec:
      serviceAccountName: {{ include "agentgateway-bootstrap.fullname" . }}-postgres-wire
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wire-database-url
          # renovate: datasource=docker depName=alpine/k8s
          image: alpine/k8s:1.37.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          env:
            - name: NAMESPACE
              value: {{ .Values.gateway.namespace | default "agentgateway-system" | quote }}
            - name: CLUSTER_NAME
              value: {{ include "agentgateway-bootstrap.postgresClusterName" . | quote }}
            - name: PARAMS_NAME
              value: {{ printf "%s-params" .Values.gateway.name | quote }}
            - name: APP_SECRET_NAME
              value: {{ printf "%s-app" (include "agentgateway-bootstrap.postgresClusterName" .) | quote }}
            - name: MODE
              value: {{ .Values.mode | quote }}
            - name: STANDALONE_CONFIGMAP
              value: "agentgateway-standalone-config"
            - name: BEDROCK_ENABLED
              value: {{ .Values.bedrock.enabled | quote }}
            - name: BEDROCK_REGION
              value: {{ include "agentgateway-bootstrap.substituteVars" (dict "str" .Values.bedrock.region "ctx" .) | quote }}
            - name: BEDROCK_MODEL
              value: {{ .Values.bedrock.model | quote }}
            - name: OPENROUTER_ENABLED
              value: {{ .Values.openrouter.enabled | quote }}
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentgateway-openrouter-secret
                  key: apiKey
                  optional: true
          command:
            - /bin/sh
            - -c
            - |
              set -eo pipefail
              echo "Waiting for CNPG cluster $CLUSTER_NAME to be ready..."
              kubectl wait --for=condition=Ready cluster.postgresql.cnpg.io/"$CLUSTER_NAME" \
                -n "$NAMESPACE" --timeout=300s

              echo "Reading connection URI from $APP_SECRET_NAME..."
              DATABASE_URL=$(kubectl get secret "$APP_SECRET_NAME" -n "$NAMESPACE" \
                -o jsonpath='{.data.uri}' | base64 -d)
              if [ -z "$DATABASE_URL" ]; then
                echo "ERROR: decoded database URL is empty" >&2
                exit 1
              fi

              if [ "$MODE" = "kubernetes" ]; then
                echo "Patching AgentgatewayParameters/$PARAMS_NAME with config.database.url..."
                PATCH=$(jq -n --arg url "$DATABASE_URL" '{spec:{rawConfig:{config:{database:{url:$url}},database:null}}}')
                kubectl patch agentgatewayparameters "$PARAMS_NAME" -n "$NAMESPACE" \
                  --type merge -p "$PATCH"
              elif [ "$MODE" = "standalone" ]; then
                echo "Waiting for standalone ConfigMap $STANDALONE_CONFIGMAP to exist..."
                until kubectl get configmap "$STANDALONE_CONFIGMAP" -n "$NAMESPACE" >/dev/null 2>&1; do
                  echo "ConfigMap $STANDALONE_CONFIGMAP not created yet, waiting..."
                  sleep 3
                done
                echo "Patching standalone ConfigMap $STANDALONE_CONFIGMAP with config.database.url..."

                # POSIX trick to get a newline into a variable without losing it to
                # command-substitution's trailing-newline stripping.
                NL=$(printf '\nX'); NL=${NL%X}

                PROVIDERS=""
                MODELS=""
                if [ "$BEDROCK_ENABLED" = "true" ]; then
                  PROVIDERS="${PROVIDERS}    - name: bedrock${NL}      provider: bedrock${NL}      params:${NL}        awsRegion: ${BEDROCK_REGION}${NL}"
                  MODELS="${MODELS}    - name: ${BEDROCK_MODEL}${NL}      provider:${NL}        reference: bedrock${NL}"
                fi
                if [ "$OPENROUTER_ENABLED" = "true" ]; then
                  KEY_VAL="${OPENROUTER_API_KEY:-}"
                  PROVIDERS="${PROVIDERS}    - name: openrouter${NL}      provider: openrouter${NL}      params:${NL}        apiKey: ${KEY_VAL}${NL}"
                  MODELS="${MODELS}    - name: deepseek/deepseek-v4-flash${NL}      provider:${NL}        reference: openrouter${NL}"
                fi

                CONFIG_YAML="config:${NL}  adminAddr: \"[::]:15000\"${NL}  database:${NL}    url: postgresql://agentgateway:\${DB_PASSWORD}@agentgateway-gw-db-rw:5432/agentgateway${NL}  storage:${NL}    mode: hybrid${NL}gateways:${NL}  default:${NL}    port: 4000${NL}llm:${NL}  policies:${NL}    apiKey:${NL}      mode: strict${NL}      keys: []${NL}  providers:${NL}${PROVIDERS}  models:${NL}${MODELS}"
                PATCH=$(jq -n --arg cfg "$CONFIG_YAML" '{data:{"config.yaml": $cfg}}')
                kubectl patch configmap "$STANDALONE_CONFIGMAP" -n "$NAMESPACE" \
                  --type merge -p "$PATCH"
                echo "Restarting standalone deployment..."
                kubectl rollout restart deployment/agentgateway-standalone -n "$NAMESPACE" || true
              fi

              echo "Done."
{{- end }}
