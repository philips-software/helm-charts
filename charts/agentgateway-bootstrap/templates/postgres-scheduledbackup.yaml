{{- if and .Values.database.enabled .Values.database.backup.volumeSnapshot.enabled .Values.database.backup.volumeSnapshot.schedule }}
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ include "agentgateway-bootstrap.postgresClusterName" . }}-backup
  namespace: {{ .Values.gateway.namespace | default "agentgateway-system" }}
  labels:
    {{- include "agentgateway-bootstrap.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  schedule: {{ .Values.database.backup.volumeSnapshot.schedule | quote }}
  backupOwnerReference: self
  method: volumeSnapshot
  cluster:
    name: {{ include "agentgateway-bootstrap.postgresClusterName" . }}
{{- end }}
