apiVersion: v2
name: agentgateway-bootstrap
description: A Helm chart for bootstrapping agentgateway with Amazon Bedrock LLM support
type: application
version: 0.11.0
# appVersion intentionally omitted: this chart wraps three independently
# versioned upstream charts (agentgatewayCrdsChart, agentgatewayChart,
# agentgatewayStandaloneChart in values.yaml, each renovate-tracked on its own).
# A single appVersion can't represent all three and was never kept in sync --
# it only ever fed the wrapper chart's own app.kubernetes.io/version label.
keywords:
  - agentgateway
  - bedrock
  - ai
  - llm
  - gateway-api
  - argocd
  - bootstrap
