# langfuse-bootstrap configuration

# Upstream langfuse-k8s Helm chart configuration. Note this chart's own
# version tracks the *wrapper* Helm chart release, not the Langfuse
# application itself - the two version independently. See langfuse.image.tag
# below to pin the actual application image tag.
langfuseChart:
  repoURL: oci://ghcr.io/langfuse/langfuse-k8s/charts
  # renovate: datasource=docker depName=ghcr.io/langfuse/langfuse-k8s/charts/langfuse
  version: 2.0.2

# ArgoCD project name
argoProject: default

# Environment configuration for ${resourcePrefix}/${region}/${accountId} variable substitution
environmentConfig:
  resourcePrefix: ""
  region: ""
  accountId: ""
  # Cluster FQDN, used to build the public hostname when ingress.httpRoute.enabled
  # is true (e.g. "example.com"). Same value dex-issuer/grafana use.
  clusterFqdn: ""

# Public exposure via Gateway API. Disabled by default (ClusterIP + port-forward,
# see README) - enable this when sso.enabled is true, since Dex must redirect back
# to a real reachable URL that exactly matches the Client CR's redirectURIs.
ingress:
  httpRoute:
    enabled: false
    # Host label; combined with environmentConfig.clusterFqdn forms the public
    # URL, e.g. "langfuse" -> https://langfuse.${clusterFqdn}
    host: langfuse
    sharedGatewayName: platform
    sharedGatewayNamespace: kube-system

# Namespace all langfuse-bootstrap resources (and the upstream chart) deploy into
namespace: langfuse-system

# Name of an existing S3 bucket for Langfuse event/media/export uploads.
# Required and cannot be empty. Supports ${resourcePrefix}/${region}/${accountId}
# substitution, same as loki-bootstrap's existingBucketName.
existingBucketName: ""

# Static credentials referenced via secretKeyRef throughout the upstream chart's
# valuesObject. MUST stay static (no runtime generation) — ArgoCD renders this
# chart via `helm template`, which regenerates anything random on every sync,
# rotating salt/encryptionKey and breaking hashed API keys / encrypted data.
# Override every field below for any real deployment; these are dev-only placeholders
# (same convention as agentgateway-bootstrap's database.password default).
credentials:
  # Salt used to hash API keys.
  salt: "changeme-langfuse-salt-please-override"
  # 256-bit (64 hex char) key for encrypting sensitive data. Generate via `openssl rand -hex 32`.
  encryptionKey: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  # NextAuth session secret.
  nextauthSecret: "changeme-nextauth-secret-please-override"
  # CNPG Postgres password for the langfuse role.
  postgresPassword: "changeme-postgres-password-please-override"
  # ClickHouse password for the built-in "default" user.
  clickhousePassword: "changeme-clickhouse-password-please-override"
  # Redis/Valkey AUTH password.
  redisPassword: "changeme-redis-password-please-override"
  # Dex OAuth2 client secret for SSO. Only used when sso.enabled is true - see
  # the sso block below for how to obtain it.
  ssoClientSecret: "changeme-sso-client-secret-please-override"

# Single Sign-On via an external Dex (or other OIDC) IdP.
#
# Prerequisite (done once, outside this chart): register an OAuth2 client
# with your Dex instance - see this repo's `dex-issuer` chart (Crossplane
# provider-dex-managed Client CRs) for the pattern. Redirect URI must be
# "https://<your langfuse host>/api/auth/callback/custom". Copy the
# resulting client id/secret into sso.clientId / credentials.ssoClientSecret.
#
# Langfuse OSS has no native groups-claim-to-role mapping (confirmed against
# the actual NextAuth signIn callback source - it only supports Google's `hd`
# domain claim and EE per-domain SSO enforcement, nothing generic for
# arbitrary `groups`). New SSO users land with no organization membership; an
# existing org owner must manually invite/promote specific users to ADMIN via
# the Langfuse UI after their first sign-in. The `groups` scope below still
# puts the claim on the ID token for visibility/audit even though Langfuse
# itself doesn't act on it.
sso:
  enabled: false
  # OIDC issuer URL for your Dex/IdP instance. Required when sso.enabled is true.
  issuer: ""
  # Display name shown on the Langfuse sign-in page.
  name: "SSO"
  # OAuth2 client id from the Client registered with your Dex/IdP (see above).
  clientId: ""
  scope: "openid email profile groups"
  # Set true to disable email/password sign-in entirely (server-side enforced,
  # not just hidden in the UI) once SSO is verified working - existing
  # password accounts are locked out too, only SSO logins succeed.
  disableUsernamePassword: false

# CNPG Postgres database for Langfuse
database:
  # Cluster resource name. Defaults to "langfuse-db" if unset.
  clusterName: ""
  instances: 1
  databaseName: langfuse
  storage:
    size: 5Gi
    # Leave empty to use the cluster's default StorageClass.
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# ClickHouse (rendered by the upstream langfuse chart itself via clickhouse.deploy:
# true — this chart only sizes it and points auth at our credentials Secret;
# the ClickHouse Operator must already be installed, see clickhouse-operator-bootstrap)
clickhouse:
  cluster:
    # Single ClickHouse node by default. Bump for HA.
    replicas: 1
    image:
      repository: clickhouse/clickhouse-server
      # renovate: datasource=docker depName=clickhouse/clickhouse-server
      tag: "26.7"
    storage:
      size: 20Gi
      # Leave empty to use the cluster's default StorageClass.
      className: ""
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 2Gi
  keeper:
    # Must be odd (1, 3, 5). 1 is a valid single-node Keeper; 3 for HA.
    replicas: 1
    image:
      repository: clickhouse/clickhouse-keeper
      # renovate: datasource=docker depName=clickhouse/clickhouse-keeper
      tag: "26.7"
    storage:
      size: 5Gi
      className: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

# Self-managed Redis (Valkey) — Langfuse's queue/cache. Deployed directly by this
# chart rather than toggling the upstream chart's bundled valkey-io/valkey subchart.
redis:
  image:
    repository: valkey/valkey
    # renovate: datasource=docker depName=valkey/valkey
    tag: "9.1"
  storage:
    size: 4Gi
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# Langfuse application configuration
langfuse:
  # Canonical URL of the deployment. Defaults to the port-forward-friendly
  # localhost URL, matching ClusterIP-only exposure. When ingress.httpRoute.enabled
  # is true, this is ignored - the URL is derived from ingress.httpRoute.host +
  # environmentConfig.clusterFqdn instead (required for SSO's OAuth callback to work).
  nextauthUrl: "http://localhost:3000"
  image:
    # Application image tag for both langfuse-web and langfuse-worker (they
    # release in lockstep). Overrides the langfuse-k8s chart's own baked-in
    # Chart.appVersion, which lags behind - tracked independently here since
    # the app and the wrapper chart release on different cadences.
    # renovate: datasource=docker depName=docker.langfuse.com/langfuse/langfuse
    tag: "4.22.0"
  web:
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        # Next.js OOMs under 1Gi during startup migrations - confirmed live.
        memory: 2Gi
  worker:
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        memory: 2Gi
