{{- include "langfuse-bootstrap.validateConfig" . -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: langfuse-helm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "langfuse-bootstrap.labels" . | nindent 4 }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: {{ .Values.argoProject }}
  # No ignoreDifferences on Deployment /spec/replicas: this deployment has no
  # HPA/KEDA anywhere that would need ArgoCD to leave replicas alone, and
  # ignoring that field was the root cause of langfuse-web silently staying
  # at 1/1 for weeks after a Karpenter eviction scaled it down - selfHeal
  # couldn't push the chart's declared replica count back onto the live
  # Deployment. Removed 2026-10-23 so replicas (web HA) actually self-heal.
  source:
    repoURL: {{ printf "%s/langfuse" .Values.langfuseChart.repoURL | quote }}
    path: "."
    targetRevision: {{ .Values.langfuseChart.version | quote }}
    helm:
      releaseName: langfuse
      valuesObject:
        {{- (tpl (.Files.Get "config/langfuse-values.yaml") .) | nindent 8 }}
  destination:
    server: "https://kubernetes.default.svc"
    namespace: {{ .Values.namespace }}
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
