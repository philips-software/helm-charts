{{- if and .Values.vpa.enabled .Values.vpa.components.web.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: langfuse-web-vpa
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "langfuse-bootstrap.labels" . | nindent 4 }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: langfuse-web
  updatePolicy:
    minReplicas: 1
    updateMode: {{ .Values.vpa.updateMode | default "InPlaceOrRecreate" }}
  resourcePolicy:
    containerPolicies:
      - containerName: '*'
        minAllowed:
          {{- toYaml .Values.vpa.components.web.minAllowed | nindent 10 }}
        maxAllowed:
          {{- toYaml .Values.vpa.components.web.maxAllowed | nindent 10 }}
        controlledResources: ["memory", "cpu"]
        # RequestsOnly (not the API default RequestsAndLimits): VPA only
        # ever adjusts the scheduling-relevant request. The declared limit
        # in values.yaml stays a fixed ceiling VPA never shrinks, so a
        # cold-start recommendation (new pod, little usage history) can't
        # leave zero headroom between typical usage and OOM - see the
        # 2026-11-18 langfuse-worker OOM crashloop this chart hit on
        # ops-tools-euw1 right after a traffic repoint, root-caused to
        # this gap (worker/clickhouse/keeper all declared a 1:1
        # request:limit ratio, which RequestsAndLimits preserved exactly -
        # web/redis never hit this because their defaults already used a
        # 2:1 ratio).
        controlledValues: RequestsOnly
{{- end }}
