{{- if .Values.ingress.httpRoute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: langfuse-httproute
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "langfuse-bootstrap.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - name: {{ .Values.ingress.httpRoute.sharedGatewayName }}
      namespace: {{ .Values.ingress.httpRoute.sharedGatewayNamespace }}
  hostnames:
    - {{ include "langfuse-bootstrap.host" . }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: langfuse-web
          port: 3000
{{- end }}
