apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "langfuse-bootstrap.postgresClusterName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "langfuse-bootstrap.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: {{ .Values.database.instances }}
  bootstrap:
    initdb:
      database: {{ .Values.database.databaseName | quote }}
      owner: {{ .Values.database.databaseName | quote }}
  # No bootstrap.initdb.secret: CNPG generates/owns the app-user password and publishes
  # it in <cluster>-app, which the upstream chart reads via postgresql.auth.existingSecret.
  # Setting an explicit secret is a footgun - it would diverge from <cluster>-app.
  # CAVEAT: bootstrap.initdb is read only during initdb, so on an ALREADY-bootstrapped
  # cluster dropping this makes CNPG create <cluster>-app with a FRESH password and
  # immediately reconcile the role - repoint consumers in the SAME change. See README.
  storage:
    size: {{ .Values.database.storage.size | quote }}
    {{- if .Values.database.storage.storageClass }}
    storageClass: {{ .Values.database.storage.storageClass | quote }}
    {{- end }}
  resources:
    requests:
      cpu: {{ .Values.database.resources.requests.cpu | quote }}
      memory: {{ .Values.database.resources.requests.memory | quote }}
    limits:
      memory: {{ .Values.database.resources.limits.memory | quote }}
