apiVersion: v1
kind: Secret
metadata:
  name: langfuse-credentials
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "langfuse-bootstrap.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  salt: {{ .Values.credentials.salt | quote }}
  encryption-key: {{ .Values.credentials.encryptionKey | quote }}
  nextauth-secret: {{ .Values.credentials.nextauthSecret | quote }}
  clickhouse-password: {{ .Values.credentials.clickhousePassword | quote }}
  redis-password: {{ .Values.credentials.redisPassword | quote }}
  sso-client-secret: {{ .Values.credentials.ssoClientSecret | quote }}
  {{- if eq .Values.s3.authType "secret" }}
  s3-endpoint: {{ .Values.s3.secretConfig.endpoint | quote }}
  s3-access-key-id: {{ .Values.s3.secretConfig.accessKeyId | quote }}
  s3-secret-access-key: {{ .Values.s3.secretConfig.secretAccessKey | quote }}
  {{- end }}
