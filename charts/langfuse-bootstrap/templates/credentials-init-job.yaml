{{- /*
Pre-install / pre-upgrade init Job that owns every *generatable* credential:

  * langfuse-credentials       -> salt, encryption-key, nextauth-secret,
                                  clickhouse-password, redis-password

The CNPG application-user password is deliberately NOT handled here: the Cluster
sets no `bootstrap.initdb.secret`, so CNPG generates and owns it and publishes it
in the `<postgresCluster>-app` Secret, which the upstream chart reads via
`postgresql.auth.existingSecret`.

Design (mirrors grafana's admin-initializer):
  * Generate a random value ONLY when the key is absent; preserve any existing
    value byte-for-byte. This makes re-syncs idempotent - salt/encryption-key
    rotation would otherwise invalidate hashed API keys and encrypted data.
  * Generated in-cluster with kubectl, NOT at Helm template time, so the
    "helm template can't use lookup" GitOps footgun disappears.
  * Non-generatable secrets (SSO client secret, S3 access keys) are NOT created
    here - they are read from pre-existing out-of-band Secrets referenced by
    sso.existingSecret / s3.secretConfig.existingSecret (same model as grafana's
    grafana-sso-creds).

The Job runs as a Helm pre-install/pre-upgrade hook and an ArgoCD PreSync hook
so it works under both plain `helm upgrade` and ArgoCD.
*/ -}}
{{- $ns := .Values.namespace -}}
{{- $hookMeta := dict
      "helm.sh/hook" "pre-install,pre-upgrade"
      "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded"
      "argocd.argoproj.io/hook" "PreSync"
      "argocd.argoproj.io/hook-delete-policy" "BeforeHookCreation" -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: langfuse-credentials-init
  namespace: {{ $ns }}
  labels:
    {{- include "langfuse-bootstrap.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-20") $hookMeta) | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: langfuse-credentials-init
  namespace: {{ $ns }}
  labels:
    {{- include "langfuse-bootstrap.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-20") $hookMeta) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: langfuse-credentials-init
  namespace: {{ $ns }}
  labels:
    {{- include "langfuse-bootstrap.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-20") $hookMeta) | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: langfuse-credentials-init
    namespace: {{ $ns }}
roleRef:
  kind: Role
  name: langfuse-credentials-init
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: langfuse-credentials-init
  namespace: {{ $ns }}
  labels:
    {{- include "langfuse-bootstrap.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-10") $hookMeta) | nindent 4 }}
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        {{- include "langfuse-bootstrap.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: credentials-init
    spec:
      serviceAccountName: langfuse-credentials-init
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init
          # renovate: datasource=docker depName=alpine/k8s
          image: alpine/k8s:1.37.1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: NAMESPACE
              value: {{ $ns | quote }}
            - name: CREDS_SECRET
              value: "langfuse-credentials"
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              log() { echo "[credentials-init] $*"; }

              # Alphanumeric only: some of these land in connection URLs and
              # special characters are not URL-encoded by the upstream chart.
              rand_alnum() {
                need="$1"; out=""
                while [ "${#out}" -lt "$need" ]; do
                  out="${out}$(LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom | head -c $((need - ${#out})) || true)"
                done
                printf '%s' "$out"
              }
              rand_hex() { od -An -N32 -tx1 /dev/urandom | tr -d ' \n'; }
              rand_b64() { head -c 32 /dev/urandom | base64 | tr -d '\n'; }

              # ensure_key SECRET KEY VALUE — write KEY only if absent/empty.
              ensure_key() {
                secret="$1"; key="$2"; value="$3"
                existing="$(kubectl get secret "$secret" -n "$NAMESPACE" -o jsonpath="{.data['$key']}" 2>/dev/null | base64 -d 2>/dev/null || true)"
                if [ -n "$existing" ]; then
                  log "$secret/$key present - preserving"
                  return 0
                fi
                log "$secret/$key absent - generating"
                if kubectl get secret "$secret" -n "$NAMESPACE" >/dev/null 2>&1; then
                  kubectl patch secret "$secret" -n "$NAMESPACE" --type merge \
                    -p "$(printf '{"stringData":{"%s":"%s"}}' "$key" "$value")"
                else
                  kubectl create secret generic "$secret" -n "$NAMESPACE" \
                    --from-literal="$key=$value" --dry-run=client -o yaml | kubectl apply -f -
                fi
              }

              ensure_key "$CREDS_SECRET" salt "$(rand_b64)"
              ensure_key "$CREDS_SECRET" encryption-key "$(rand_hex)"
              ensure_key "$CREDS_SECRET" nextauth-secret "$(rand_alnum 32)"
              ensure_key "$CREDS_SECRET" clickhouse-password "$(rand_alnum 32)"
              ensure_key "$CREDS_SECRET" redis-password "$(rand_alnum 32)"

              log "done"
