apiVersion: v2
name: fluent-bit-out-hsdp
description: Installs the Fluentbit HSP out plugin.
keywords:
  - logging
  - fluent-bit
  - fluentd
  - hsdp
version: 0.14.0
# appVersion intentionally omitted: this chart has no templates/ of its own
# (it vendors fluent-bit as a Helm dependency below), so appVersion was never
# referenced by anything -- it only duplicated, and had already drifted from,
# the real image tag in values.yaml's `image:` field (also renovate-tracked,
# independently, under the same depName).
icon: https://fluentbit.io/images/logo.svg
home: https://github.com/philips-software/fluent-bit-out-hsdp
sources:
  - https://github.com/philips-software/fluent-bit-out-hsdp/
maintainers:
  - name: loafoe
    email: andy.loafoe@gmail.com
dependencies:
  - name: fluent-bit
    # renovate: datasource=helm depName=fluent-bit registryUrl=https://fluent.github.io/helm-charts
    version: 0.56.0
    repository: https://fluent.github.io/helm-charts
